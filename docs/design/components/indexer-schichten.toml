id = "indexer-schichten"
title = "Indexer L1 to L3, increment with watermark, item index, Ask flow"
kind = "service"
path = "services/indexer/src/jobs/"
package = "@guildwork/service-indexer"
stage = "7"
purpose = "Extends the service indexer from 7a with the layers L1 (structure), L2 (summaries) and L3 (full text and vectors), the item index for issues and PRs, the embedding of the Learnings and the mode ask; plus the acceptance of the LayerDeltas in the control plane (apps/control-plane/src/kb/) with the watermark only after success. Not here: L0 and L5 including the Learnings lifecycle (7a), the query implementation in plugins/pg-kb and the tools kb.* of the platform MCP."
design = [
  "12-expansion.md#21-indexer-l1-to-l3-7-e01",
  "12-expansion.md#22-embedder-and-vector-search-7-e01",
  "12-expansion.md#23-mcp-tools-kb-and-ask-7-e02",
  "12-expansion.md#31-tables-of-stage-7",
  "12-expansion.md#34-envelopes-and-file-formats",
  "12-expansion.md#35-endpoints",
  "12-expansion.md#41-indexer-increment",
  "12-expansion.md#42-ask",
  "12-expansion.md#5-failure-and-abort-paths",
  "12-expansion.md#7-configuration",
]
built_by = [
  "7-E01-T02",
  "7-E01-T03",
  "7-E01-T04",
  "7-E01-T06",
  "7-E01-T08",
  "7-E01-T09",
  "7-E01-T10",
  "7-E02-T02",
]

