id = "config-resolver"
title = "Config resolver: schemas installation, org, repo, loading at the base SHA, merge, fail closed, snapshot, repo_overrides"
kind = "package"
path = "packages/config/"
package = "@guildwork/config"
stage = "0"
purpose = "Provides the effective configuration of a run: schemas with x-merge and x-qualification, loading of the org, group and repo files at the pinned SHA, merging only in the stricter direction, fail closed, consistency rules, snapshot with qualification_key per service, expression language and repo_overrides. Not here: the loader of installation.yaml (config-installation), the profile and key themselves (qualifikationsprofil) and the resolver rules of the plugin areas (config-resolver-regeln)."
design = [
  "02-control-plane.md#46-config-resolver",
  "02-control-plane.md#22-public-interfaces",
  "02-control-plane.md#43-router",
  "02-control-plane.md#5-failure-and-abort-paths",
]
