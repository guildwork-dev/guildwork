id = "db-migrator"
title = "Migrator with gates, schema check at start and role migrate"
kind = "package"
path = "packages/db/src/migrator/"
package = "@guildwork/db"
stage = "0"
purpose = "Applies the numbered SQL migrations forward only (lock against parallel runs, checksums, backup gate, halt points, minimum versions of PostgreSQL and pgvector) and checks at the start of each role whether schema and release match. Not here: content of the migrations (db-schema-kern and the areas), linter (migration-lint), flow of guildwork upgrade (CLI)."
design = ["01-data-model.md#2-modules-and-responsibility", "01-data-model.md#21-audit-port-locks-and-test-callback", "01-data-model.md#31a-migration-blocks-and-table-directory", "01-data-model.md#41-migration", "01-data-model.md#42-schema-check-at-startup", "01-data-model.md#5-failure-and-abort-paths", "06-installation-operations-ui.md#210-upgrade-and-way-back"]
built_by = ["0-E02-T02", "0-E02-T03", "0-E18-T12"]

[[provides]]
name = "migrator"
kind = "ts-api"
title = "createMigrator, loadMigrationFiles, MigrationFile, MigrateOptions (with haltPoints), MigratePlan, MigrateResult, MigrateErrorCode"
defined_in = "01-data-model.md#2-modules-and-responsibility"
from_task = "0-E02-T02"

[[provides]]
name = "migrationsdatei"
kind = "file"
title = "Migration file packages/db/migrations/NNNN_name.sql with header lines phase, transactional, min_app_release, haltepunkt (FE-113)"
defined_in = "01-data-model.md#41-migration"
from_task = "0-E02-T02"

[[provides]]
name = "tabellenverzeichnis"
kind = "file"
title = "Number blocks per stage (machine-readable packages/db/migrations/blocks.json) and table directory: each table exactly once with migration and leading document (FE-126, FE-128)"
defined_in = "01-data-model.md#31a-migration-blocks-and-table-directory"
from_task = "0-E02-T02"

[[provides]]
name = "rolle-migrate"
kind = "cli"
title = "Role migrate of the control plane: runMigrateRole(MigrateRoleInput, MigrateRoleDeps), then exit 0, 1 or 2"
defined_in = "01-data-model.md#25-role-migrate"
from_task = "0-E02-T02"

[[provides]]
name = "test-rueckruf"
kind = "ts-api"
title = "@guildwork/db/testing: migrateForTests(adminUrl) and roleUrls for testkit.startPostgres (FE-130)"
defined_in = "01-data-model.md#21-audit-port-locks-and-test-callback"
from_task = "0-E02-T02"

[[provides]]
name = "startcheck"
kind = "ts-api"
title = "startCheck(db, { release, requiredVersions }) with StartCheck results; requiredVersions from generated/required-versions.ts; BYPASSRLS allowed only for DbConfig.role ops (FE-141)"
defined_in = "01-data-model.md#42-schema-check-at-startup"
from_task = "0-E02-T03"

[[provides]]
name = "konfig.migrate"
kind = "config"
title = "installation.yaml: migrate.lock_wait_s, migrate.recent_backup_max_age"
defined_in = "01-data-model.md#7-configuration"
from_task = "0-E02-T03"

[[provides]]
name = "metriken.start"
kind = "metric"
title = "guildwork.db.startup_unreachable, guildwork.app.not_ready, guildwork.migrate.lock_timeout"
defined_in = "01-data-model.md#24-metrics"
from_task = "0-E02-T03"

