[[task]]
id = "0-E16-T05"
title = "E2E failure paths: lease expiry, dedupe, effect idempotency"
description = """Three end-to-end cases with the dummy per detailed design 06 section 8.5: (1) lease expiry: the worker is terminated during fail hang, the lease expires, the item becomes available again, a second worker completes, the result of the old lease is discarded; (2) dedupe: the same webhook with the same delivery ID twice yields one run and counter ingress_duplicate equal to 1; (3) effect idempotency: a duplicate complete or a retry of the effect after a forced error in the gateway yields exactly one effect entry. For each case it is checked what is stored, audited and logged (03 section 5)."""
design = ["06-installation-operations-ui.md#85-dummy-service-end-to-end", "06-installation-operations-ui.md#5-failure-and-abort-paths"]
