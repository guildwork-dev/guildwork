id = "alarm-automat"
title = "Alert state machine with rules, sinks and health sources"
kind = "role"
path = "apps/control-plane/src/alerts/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Computes the required alerts itself in the role orchestrator from stored facts, keeps their state in the table alerts, delivers them via log, webhook and later notifier and shows them in the admin API. No third-party alarm backend; rules of other areas dock on via the rule list."
