id = "contract-harness"
title = "Contract harness: cassettes, replay, recording, attestation, abstract suites"
kind = "package"
path = "packages/testkit/src/contract/"
package = "@guildwork/testkit"
stage = "0"
purpose = "Checks every plugin and every driver against its contract with recorded real responses: cassette format, strict replay without network, recording without external effect, redaction, attestation and the abstract suites per kind with reference fakes. Not here: the implementations of the plugins and drivers and the load check at runtime (plugin-rahmen)."
design = [
  "05-plugins-and-contracts.md#210-contract-harness",
  "05-plugins-and-contracts.md#24-manifest-and-versioning",
  "04-effects-audit-credentials.md#241-loading-and-capabilities",
  "04-effects-audit-credentials.md#8-tests",
]
built_by = ["0-E03-T01", "0-E13-T07", "0-E13-T08", "2-E05-T01", "8-E01-T05", "8-E01-T06"]

