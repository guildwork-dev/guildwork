id = "event-schema"
title = "Event schema, command parser, dedupe and routing keys"
kind = "package"
path = "packages/contracts/src/events/"
package = "@guildwork/contracts"
stage = "0"
purpose = "The only definition of the normalized event (TriggerEvent through StoredEvent) together with the pure functions that TriggerSources, ingress and router need in common: command parser, dedupe key, routing name and object key (FE-501). Not here: ingress, inbox and router themselves (detailed design 02) and internal events of the orchestrator such as item.triaged."
design = [
  "05-plugins-and-contracts.md#2111-event-schema-ruling-fe-501",
  "05-plugins-and-contracts.md#213-normalized-foundations-that-other-documents-use",
]
built_by = ["0-E13-T02"]

