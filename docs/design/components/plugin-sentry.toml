id = "plugin-sentry"
title = "TriggerSource sentry"
kind = "plugin"
path = "plugins/sentry/"
package = "@guildwork/plugin-sentry"
stage = "10"
purpose = "TriggerSource for Seer events from Sentry, mapped to the same event and the same body as incident-handoff; signature headers and fields are unverified and are verified in 10-E03-T02 against documentation and recording. No handoff logic of its own (it lives in incident/intake)."
design = [
  "15-stage-10-edge-layers.md#252-plugin-sentry",
  "15-stage-10-edge-layers.md#253-route-with-a-responsible-person-and-handover",
  "15-stage-10-edge-layers.md#83-incident-handoff-10-e03",
]
built_by = ["10-E03-T02", "10-E03-T03"]

[[provides]]
name = "trigger-source"
kind = "contract"
title = "TriggerSource sentry: verify (HMAC, strength per FE-1524), parse only Seer events, mapping to IncidentHandoffBodyV1 and event incident.handoff"
defined_in = "15-stage-10-edge-layers.md#252-plugin-sentry"
from_task = "10-E03-T02"

[[provides]]
name = "konfig"
kind = "config"
title = "SentryConfig under plugins.triggers[sentry] (client_secret_ref, scm, project_repos, tolerance_s, ticket)"
defined_in = "15-stage-10-edge-layers.md#252-plugin-sentry"
from_task = "10-E03-T02"

[[uses]]
interface = "contracts/vertrag-trigger-source"
from_task = "10-E03-T02"
purpose = "TriggerSource v1alpha1"

[[uses]]
