name = "cli"
kind = "cli"
title = "guildwork-egress-proxy --config <egress.yaml> (command of the image egress-proxy)"
defined_in = "03-execution.md#29-egress-proxy"
from_task = "0-E12-T04"

[[provides]]
name = "egress-yaml"
