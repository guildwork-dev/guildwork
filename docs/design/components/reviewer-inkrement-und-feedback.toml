id = "reviewer-inkrement-und-feedback"
title = "Increment, finding lifecycle and feedback harvesting"
kind = "service"
path = "services/reviewer/src/controller/increment/"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Carries findings across pushes (line mapping, recheck, addressed, outdated, withdrawn) and harvests feedback from the threads at run start and at merge into finding_feedback; from stage 6 on it verifies findings marked as fixed. No posting (that is done by reviewer-ausgabe)."
design = [
  "08-reviewer.md#411-finding-lifecycle-and-increment",
  "08-reviewer.md#412-feedback",
  "08-reviewer.md#29-building-blocks-of-the-controller",
  "09-reviewer-companion-features-and-learnings.md#45-mark-as-fixed",
]
built_by = ["1-E04-T05", "1-E04-T06", "6-E04-T06"]

[[provides]]
name = "inkrement"
kind = "ts-api"
title = "planIncrement(open, LineMap[], fullRun): IncrementPlan with unchanged, outdated, recheck"
defined_in = "08-reviewer.md#29-building-blocks-of-the-controller"
from_task = "1-E04-T05"

[[provides]]
name = "befund-lebenszyklus"
kind = "contract"
title = "States and transitions of FindingState, addressed_sha according to FE-834, review_pr_state after the run"
defined_in = "08-reviewer.md#411-finding-lifecycle-and-increment"
from_task = "1-E04-T05"

[[provides]]
name = "feedback-ernte"
kind = "ts-api"
title = "harvestFeedback(): read threads, signals into finding_feedback with freshly read permission, merged_open"
defined_in = "08-reviewer.md#412-feedback"
from_task = "1-E04-T06"

[[provides]]
name = "verifikation-dev-claim"
kind = "ts-api"
title = "Incremental run checks dev_claim_state claimed: verified with addressed or refuted with a line in the thread"
defined_in = "09-reviewer-companion-features-and-learnings.md#45-mark-as-fixed"
from_task = "6-E04-T06"

[[uses]]
interface = "reviewer-kontext-werkzeug/cli-diff"
