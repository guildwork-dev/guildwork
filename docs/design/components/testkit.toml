id = "testkit"
title = "Package testkit: Postgres container, fixtures, clock, logs, secret scan, fakes"
kind = "package"
path = "packages/testkit/"
package = "@guildwork/testkit"
stage = "0"
purpose = "Shared test helpers of all areas: real Postgres per test file, controllable clock and randomness, log capture, secret check, HTTP replay with network block and the fakes and check helpers that tests of several areas need. Only in test files; contract harness and E2E stack in the same package are separate components. Building blocks whose signature another area defines (test IdP, fake Anthropic, telemetry sink, Azure recorder from 06 section 2.17, expectRecordedEffects from 04 section 2.1.6) are built by testkit as well, but they are offered there (00 FE-060)."
design = ["00-codebase-and-conventions.md#27-package-testkit", "00-codebase-and-conventions.md#82-containers-fixtures-determinism", "00-codebase-and-conventions.md#84-test-cases-per-module", "06-installation-operations-ui.md#217-test-building-blocks-in-the-testkit"]
built_by = ["0-E01-T07", "0-E02-T01", "0-E08-T05", "0-E09-T03", "0-E12-T09", "0-E12-T10", "0-E16-T02", "0-E16-T07", "0-E17-T02", "0-E18-T16", "0b-E01-T02", "2-E01-T08"]

