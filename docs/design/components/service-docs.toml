id = "service-docs"
title = "Docs service: drift check, docstrings, sync, release"
kind = "service"
path = "services/docs/"
package = "@guildwork/service-docs"
stage = "10"
purpose = "Keeps documentation current without changing code: drift check on PRs (never blocking), docstrings of touched symbols as a follow-up PR, docs PR after merge and release notes as a changelog PR. Not for merges, tags or publications (always done by a human) and not for code changes."
