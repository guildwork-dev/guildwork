id = "embedder"
title = "Optional service embedder"
kind = "service"
path = "services/embedder/"
package = "@guildwork/service-embedder"
stage = "7"
purpose = "Computes embeddings with a local model under a free license on CPU, only in the internal network of the control plane, own image with bundled model and checksum (FE-1205, O7). Not a service in the sense of the service manifests: no work items, no effects, no network to the outside; addressed only via the ModelProvider local-embed."
design = [
  "12-expansion.md#22-embedder-and-vector-search-7-e01",
  "12-expansion.md#6-security",
]
built_by = [
  "7-E01-T01",
  "7-E01-T07",
]

[[provides]]
name = "modellwahl"
kind = "file"
title = "eval/reports/k5-embedding-wahl.md: chosen model, ONNX version, runtime, licenses, dimension, measurements from K5"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T01"

[[provides]]
name = "http-embed"
kind = "http"
title = "POST /v1/embed and GET /v1/health (EmbedRequest, EmbedResponse; errors EMBED_INVALID, EMBED_TOO_LARGE, EMBED_NOT_READY)"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T07"

[[provides]]
name = "image-embedder"
kind = "file"
title = "Container image embedder with model and checksum (distribution bundled), signed with the release"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T07"

[[provides]]
name = "konfig-embedder"
kind = "config"
title = "EmbedderConfig via GW_EMBEDDER_PORT, GW_EMBEDDER_MODEL_DIR, GW_EMBEDDER_MODEL_SHA256, GW_EMBEDDER_THREADS (FE-1258)"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T07"

[[uses]]
interface = "eval-saetze-stufe-7/adapter-k5"
from_task = "7-E01-T01"
purpose = "K5 run of the candidates for the model choice"

[[uses]]
interface = "lizenz-gate/lizenz-listen"
from_task = "7-E01-T01"
purpose = "Check licenses of model, weights, ONNX version and runtime against the allowlist"

[[uses]]
interface = "lizenz-gate/toolchain-md"
from_task = "7-E01-T01"
purpose = "Record license, source location and retrieval date of onnxruntime-node and the model"

[[uses]]
interface = "core/logger"
from_task = "7-E01-T07"
purpose = "Log start, checksum errors and requests without input texts"

[[uses]]
interface = "container-images/images-workflow"
from_task = "7-E01-T07"
purpose = "Build the image embedder under deploy/images/embedder/ in the matrix, by digest"

[[uses]]
interface = "release-werkzeuge/image-lizenz-gate"
from_task = "7-E01-T07"
purpose = "License gate over the SBOM of the image embedder"

[[uses]]
interface = "release-werkzeuge/third-party-components"
from_task = "7-E01-T07"
purpose = "Enter model and runtime as components with SPDX and source"

[[uses]]
interface = "compose-buendel/profil-kb-vectors"
from_task = "7-E01-T07"
purpose = "Start the service embedder in the profile kb-vectors in the internal network"
