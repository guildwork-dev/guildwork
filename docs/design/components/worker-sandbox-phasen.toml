id = "worker-sandbox-phasen"
title = "Sandbox phases, egress policy per phase and sandbox without DNS"
kind = "role"
path = "apps/worker/src/phases/"
package = "@guildwork/worker"
stage = "2"
purpose = "Takes every agent sandbox through setup, agent and check phase: secrets only in the setup phase, egress policy per item, service and phase with a probe before the harness start, connection log per item and sandbox without DNS resolver (in addition apps/worker/src/egress-policy and apps/worker/src/dns). Not: building the environment snapshot (worker-umgebungs-snapshot) and not the egress proxy itself (egress-proxy)."
design = ["10-planner-architect-coder.md#25-sandbox-phases-enforced-egress-proxy-no-dns", "10-planner-architect-coder.md#5-failure-and-abort-paths"]
built_by = ["2-E01-T02", "2-E01-T05", "2-E01-T07", "2-E01-T08"]

[[provides]]
name = "spike-protokoll"
kind = "file"
title = "Check record docs/design/spikes/2-E01-T02.md: DNS on internal networks, offline protocols per package manager, offline databases (OP-2 to OP-4)"
defined_in = "10-planner-architect-coder.md#101-open-points-clarified-during-building"
from_task = "2-E01-T02"

[[provides]]
name = "phasenwechsel"
kind = "ts-api"
title = "Implementation of EnvironmentService.switchPhase: unmount secrets tmpfs, switch policy, egress probe, otherwise egress_not_enforced (FE-1037)"
defined_in = "10-planner-architect-coder.md#25-sandbox-phases-enforced-egress-proxy-no-dns"
from_task = "2-E01-T05"

[[provides]]
name = "egress-policy"
kind = "ts-api"
title = "EgressPolicy and EgressPhase per item to the control API of the egress proxy; registry-cache.internal only for the coder"
defined_in = "10-planner-architect-coder.md#25-sandbox-phases-enforced-egress-proxy-no-dns"
from_task = "2-E01-T07"

[[provides]]
name = "verbindungsprotokoll"
kind = "file"
title = "EgressConnectionLog as NDJSON under t/<tenant>/runs/<runId>/egress/<itemId>.ndjson, reference in the Run Record"
defined_in = "10-planner-architect-coder.md#34-blobstore-keys"
from_task = "2-E01-T07"

[[provides]]
name = "metrik-egress-denied"
kind = "metric"
title = "Counter egress_denied per service"
defined_in = "10-planner-architect-coder.md#5-failure-and-abort-paths"
from_task = "2-E01-T07"

[[provides]]
name = "heartbeat-phase"
kind = "http"
title = "Field phase in the heartbeat body, the Work API writes sandbox.phase_switched"
defined_in = "10-planner-architect-coder.md#219-endpoints"
from_task = "2-E01-T05"

[[provides]]
name = "setup-secrets-grant"
kind = "ts-api"
title = "GrantsV1.setupSecrets from envelope.inputs.setupSecretNames, coder only, broker purpose blueprint_setup (FE-1070)"
defined_in = "10-planner-architect-coder.md#221-docking-points-of-the-worker-to-the-control-plane-stage-2"
from_task = "2-E01-T05"

[[provides]]
name = "eingabe-grants"
kind = "http"
title = "GrantsV1.inputs (InputGrantV1) with presignGet or one-time URL GET /work/v1/inputs/{grantId} (FE-1070)"
defined_in = "10-planner-architect-coder.md#221-docking-points-of-the-worker-to-the-control-plane-stage-2"
from_task = "2-E01-T05"

[[provides]]
name = "tabelle-input-grants"
kind = "table"
title = "input_grants (migration 0215), fallback level of the input grants without PRESIGN"
defined_in = "10-planner-architect-coder.md#32-new-tables-migrations-0200-to-0299-fe-1049"
from_task = "2-E01-T05"

