id = "plugin-opencode"
title = "Harness opencode"
kind = "plugin"
path = "plugins/opencode/"
package = "@guildwork/plugin-opencode"
stage = "9"
purpose = "AgentRuntime for OpenCode: opencode serve only on the sandbox loopback, controlled via the bridge gw-opencode-bridge, only if the spike verifies the license. Not: port exposure to the worker (FE-1418), subscription logins."
design = [
  "14-stage-9-breadth-and-hardening.md#231-spike-and-common-harness-framework",
  "14-stage-9-breadth-and-hardening.md#233-harness-opencode",
  "14-stage-9-breadth-and-hardening.md#83-harnesses-9-e03",
]
built_by = ["9-E03-T01", "9-E03-T03"]

[[provides]]
name = "agent-runtime"
kind = "contract"
title = "AgentRuntime opencode: serve plus bridge in the sandbox, output as OhBridgeOut, credential only api_key via the relay, STRUCTURED_OUTPUT per spike"
defined_in = "14-stage-9-breadth-and-hardening.md#233-harness-opencode"
from_task = "9-E03-T03"

[[provides]]
name = "konfig-harness"
kind = "config"
title = "runtimes[].harness = opencode and harness.opencode.port (port of opencode serve in the sandbox)"
defined_in = "14-stage-9-breadth-and-hardening.md#7-configuration"
from_task = "9-E03-T03"

[[provides]]
name = "oc-bridge-protokoll"
kind = "file"
title = "Protocol guildwork.oc-bridge/v1: OcBridgeIn on stdin, OcBridgeOut as JSON lines on stdout (FE-1450)"
defined_in = "14-stage-9-breadth-and-hardening.md#233-harness-opencode"
from_task = "9-E03-T03"

