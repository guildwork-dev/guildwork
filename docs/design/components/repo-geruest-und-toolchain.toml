id = "repo-geruest-und-toolchain"
title = "Build repo scaffold: required and community files, TypeScript and Python toolchain, binary bootstrap, Makefile with gates.toml"
kind = "tool"
path = "./"
stage = "R"
purpose = "The scaffold on which every task builds: required and community files, package template, TypeScript and Python toolchain, verified binary download, Makefile with gates.toml as the only gate list and the local dry run of the workflows. Not the individual check tools (own components)."
design = ["00-codebase-and-conventions.md#21-monorepo-layout", "00-codebase-and-conventions.md#23-toolchain", "00-codebase-and-conventions.md#24-make-targets", "00-codebase-and-conventions.md#35-file-formats-of-the-check-tools", "00-codebase-and-conventions.md#41-contribution-branch-commit-pr", "00-codebase-and-conventions.md#48-stage-r-before-the-first-push"]
built_by = ["R-E01-T03", "R-E01-T04", "R-E01-T05", "R-E01-T06", "R-E03-T05"]

