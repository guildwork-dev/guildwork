id = "prfixer-modi"
title = "PR fixer modes dependency_update and ci_doctor"
kind = "service"
path = "services/prfixer/src/modes/"
package = "@guildwork/service-prfixer"
stage = "10"
purpose = "Two modes of the PR fixer as strategies of the same controller: dependency_update repairs red bot update PRs as a stacked PR, manifest and lockfile only via the package manager; ci_doctor finds the cause of red CI on the default branch and keeps updating the same issue. Not for the PR fixer core (11 section 2.4), not for pushes or reruns on the default branch and not for the executor issue (effect catalog)."
design = [
  "15-stage-10-edge-layers.md#24-pr-fixer-modes-dependency_update-and-ci_doctor-10-e02",
  "15-stage-10-edge-layers.md#241-profile-dependency_update",
  "15-stage-10-edge-layers.md#242-mode-ci_doctor",
  "15-stage-10-edge-layers.md#45-dependency_update",
  "15-stage-10-edge-layers.md#46-ci_doctor",
  "15-stage-10-edge-layers.md#28-eval-and-acceptance-10-e01-t05-10-e02-t03-10-e06",
  "15-stage-10-edge-layers.md#82-pr-fixer-modes-and-executor-issue-10-e02",
]
built_by = ["10-E02-T01", "10-E02-T02", "10-E02-T03"]

