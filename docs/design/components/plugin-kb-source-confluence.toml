id = "plugin-kb-source-confluence"
title = "Confluence as a KB source"
kind = "plugin"
path = "plugins/kb-source-confluence/"
package = "@guildwork/plugin-kb-source-confluence"
stage = "9"
purpose = "Read-only document source for the knowledge base: pages of allowed Confluence spaces, redacted and stored as chunks doc with visibility per space; off by default, only with data_policy approval. Not: writing to Confluence, own search index, retrieval in the worker (FE-1442)."
design = [
  "14-stage-9-breadth-and-hardening.md#274-confluence-as-a-kb-source",
  "14-stage-9-breadth-and-hardening.md#31-tables-block-0900",
  "14-stage-9-breadth-and-hardening.md#87-sarif-zoekt-k1-confluence-9-e07",
]
built_by = ["9-E07-T04"]

[[provides]]
name = "knowledge-store-doc-source"
kind = "contract"
title = "KnowledgeStore with capability DOC_SOURCE and DocumentSourceApi: listSpaces, changedPages, getPage"
defined_in = "14-stage-9-breadth-and-hardening.md#274-confluence-as-a-kb-source"
from_task = "9-E07-T04"

[[provides]]
name = "konfig-confluence"
kind = "config"
title = "ConfluenceSourceConfig (site, auth, spaceAllowlist, visibility per space, maxPageChars)"
defined_in = "14-stage-9-breadth-and-hardening.md#274-confluence-as-a-kb-source"
from_task = "9-E07-T04"

[[provides]]
name = "konfig-doc-sources"
kind = "config"
title = "knowledge.doc_sources[] (spaces per repo or project) and data_policy.kb_sources (approval of external document sources)"
defined_in = "14-stage-9-breadth-and-hardening.md#7-configuration"
from_task = "9-E07-T04"

[[provides]]
name = "kb-doc-pages"
kind = "table"
title = "Table kb_doc_pages (migration 0909): metadata per page and version, visibility per space"
defined_in = "14-stage-9-breadth-and-hardening.md#31-tables-block-0900"
from_task = "9-E07-T04"

[[provides]]
name = "doc-citation"
kind = "ts-api"
title = "DocCitation { space, pageId, version, title, url } as a citation from kb.search with kinds doc"
defined_in = "14-stage-9-breadth-and-hardening.md#274-confluence-as-a-kb-source"
from_task = "9-E07-T04"

[[provides]]
name = "kb-doc-sources"
kind = "queue"
title = "Queue kb-doc-sources per Confluence instance (singletonKey), cadence knowledge.doc_sources[].interval_min"
