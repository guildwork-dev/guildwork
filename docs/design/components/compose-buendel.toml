id = "compose-buendel"
title = "Single-host Compose bundle with profiles and host preparation"
kind = "delivery"
path = "deploy/compose/"
stage = "0"
purpose = "The Compose bundle that the installer writes into the target folder: services, networks according to ADR-62, volumes, healthchecks, Caddy routes, profiles s3, pitr, observability and kb-vectors, fragment rule and host-prepare.sh; not the installer logic (cli-install), not the programs in the services and not the fragment observability.compose.yaml (telemetry)."
design = ["06-installation-operations-ui.md#23-compose-bundle-single-host", "06-installation-operations-ui.md#6-security", "00-codebase-and-conventions.md#29-observability-and-required-alerts"]
