id = "plugin-model-vertex"
title = "ModelProvider vertex"
kind = "plugin"
path = "plugins/model-vertex/"
package = "@guildwork/plugin-model-vertex"
stage = "8"
purpose = "ModelProvider for single calls to Anthropic models on Vertex AI (Vercel AI SDK), executed in the worker as work item model_call, access via the grant vertex (FE-1327). Not included: the start path vertex of the harness claude-code and the identity (driver-identity-gcp); EU applies only after evidence (FE-1326)."
design = [
  "13-stage-8-providers-and-bases.md#226-modelprovider-bedrock-vertex-and-foundry",
  "13-stage-8-providers-and-bases.md#45-start-with-bedrock-vertex-and-foundry",
  "13-stage-8-providers-and-bases.md#82-providers-8-e02",
]
built_by = ["8-E02-T05"]

[[provides]]
name = "modelprovider"
kind = "contract"
title = "ModelProvider vertex (manifest id vertex): generate, models, capabilities TOOLS native, STRICT_SCHEMA fallback, PROMPT_CACHE none until verified, REGION_EU per FE-1326; cost.source price_table without usd; contract attestation"
defined_in = "13-stage-8-providers-and-bases.md#226-modelprovider-bedrock-vertex-and-foundry"
from_task = "8-E02-T05"

[[provides]]
name = "konfig-models"
kind = "config"
title = "models[] with plugin vertex: VertexModelConfig (id, credential of kind vertex, models)"
defined_in = "13-stage-8-providers-and-bases.md#226-modelprovider-bedrock-vertex-and-foundry"
from_task = "8-E02-T05"

