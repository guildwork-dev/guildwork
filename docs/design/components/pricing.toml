[[uses]]
interface = "cli-doctor/doctor-check"
from_task = "8-E06-T01"
purpose = "Hint on an old table in doctor"

[[uses]]
interface = "ui-betrieb/status-api"
from_task = "8-E06-T01"
purpose = "Hint price missing or old table in the admin UI"

[[uses]]
interface = "testkit/postgres"
from_task = "8-E06-T01"
purpose = "Tests of syncPriceEntries with a real database"
