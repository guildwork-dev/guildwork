id = "plugin-host"
title = "Plugin host: trust level, signature, subprocess transport gRPC, distribution as an OCI artifact"
kind = "package"
path = "packages/plugin-host/"
package = "@guildwork/plugin-host"
stage = "9"
purpose = "Loads plugins and services from signed OCI artifacts with the trust level that the installation assigns, and talks to them via gRPC in a subprocess or in their own container; in addition intake via admin API, CLI and admin UI. Not: starting containers from the control plane (FE-1430), running third-party code in Z0, DB access in the package (intake writes apps/control-plane/src/plugins/third-party.ts)."
design = [
  "14-stage-9-breadth-and-hardening.md#20-directories-and-packages",
  "14-stage-9-breadth-and-hardening.md#251-trust-level-and-signature",
  "14-stage-9-breadth-and-hardening.md#252-subprocess-transport-grpc",
  "14-stage-9-breadth-and-hardening.md#254-distribution-as-an-oci-artifact",
  "14-stage-9-breadth-and-hardening.md#31-tables-block-0900",
  "14-stage-9-breadth-and-hardening.md#46-taking-in-loading-and-crashing-a-plugin",
  "14-stage-9-breadth-and-hardening.md#412-states",
  "14-stage-9-breadth-and-hardening.md#6-security",
  "14-stage-9-breadth-and-hardening.md#85-third-party-plugins-and-services-9-e05",
]
built_by = ["9-E05-T01", "9-E05-T02", "9-E05-T04"]

