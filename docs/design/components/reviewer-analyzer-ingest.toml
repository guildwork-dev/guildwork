id = "reviewer-analyzer-ingest"
title = "Analyzer in mode ingest: SARIF from CI artifacts and code scanning"
kind = "service"
path = "services/reviewer/src/controller/analyzers/"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Fetches SARIF bytes from CI artifacts (optionally code scanning) with size limits into the BlobStore and feeds the normalized analyzer findings as a candidate signal into the finder context and the verifier (ADR-40); from stage 2 on also findings from analyzer run. Never parses in the controller (FE-821) and never produces unverified findings (FE-822)."
design = [
  "08-reviewer.md#414-analyzers-in-mode-ingest",
  "08-reviewer.md#83-cross-cutting-suites",
  "10-planner-architect-coder.md#215-platform-gate-guildworkquality-gate",
]
built_by = ["1-E06-T02", "1-E06-T03", "1-E06-T04", "1-E06-T05", "2-E05-T08"]

[[provides]]
name = "quelle-ci-artifact"
kind = "ts-api"
title = "fetch.ts: workflow run at the head, artifact as bytes in runs/<runId>/reviewer/sarif/, waiting until analyzers.ingest_wait_min"
defined_in = "08-reviewer.md#414-analyzers-in-mode-ingest"
from_task = "1-E06-T02"

[[provides]]
name = "metrik-ingest"
kind = "metric"
title = "reviewer_analyzer_ingest_total{status}"
defined_in = "08-reviewer.md#5-failure-and-abort-paths"
from_task = "1-E06-T02"

[[provides]]
name = "quelle-code-scanning"
kind = "ts-api"
title = "Source scm_code_scanning, off by default until the permission check"
defined_in = "08-reviewer.md#414-analyzers-in-mode-ingest"
from_task = "1-E06-T03"

[[provides]]
name = "analyzer-kandidaten"
kind = "ts-api"
title = "Analyzer candidates source analyzer:<id> in context part 9 and verifier, llmUse forbidden only counted, allowlist check"
defined_in = "08-reviewer.md#414-analyzers-in-mode-ingest"
from_task = "1-E06-T04"

[[provides]]
name = "sarif-fixtures"
kind = "file"
title = "SARIF fixtures of real outputs of Opengrep, gitleaks and osv-scanner in a pinned version"
defined_in = "08-reviewer.md#83-cross-cutting-suites"
from_task = "1-E06-T05"

[[provides]]
name = "quelle-run"
kind = "ts-api"
title = "Findings from analyzer run in addition to ingest as verifier candidates, dedupe via fingerprint, IoU and CWE"
defined_in = "10-planner-architect-coder.md#215-platform-gate-guildworkquality-gate"
from_task = "2-E05-T08"

