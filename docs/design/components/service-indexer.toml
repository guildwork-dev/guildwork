id = "service-indexer"
title = "Indexer service: scaffold, L0 and L5 on merge"
kind = "service"
path = "services/indexer/"
package = "@guildwork/service-indexer"
stage = "7a"
purpose = "Service indexer as a deterministic controller job in the control plane without sandbox and without model (FE-941): manifest, inputs via the router, layer state L0 with watermark and rebuild rules, L5 increment per merge (harvest, release PR binding, check citations at the default head). Not here: the layers L1 to L3, jobs with LayerDelta and Ask (stages 7, 12) and the domain logic of the Learnings (learnings-lebenszyklus)."
design = [
  "09-reviewer-companion-features-and-learnings.md#212-indexer-l0-and-l5",
  "09-reviewer-companion-features-and-learnings.md#35-queues-pg-boss",
  "09-reviewer-companion-features-and-learnings.md#49-l5-on-merge",
  "09-reviewer-companion-features-and-learnings.md#7-configuration",
  "09-reviewer-companion-features-and-learnings.md#82-sub-stage-7a-per-module",
]
built_by = ["7a-E02-T01", "7a-E02-T02"]

[[provides]]
name = "service-manifest"
kind = "contract"
title = "Service manifest indexer with inputs pushed_default, change.merged and change.closed via the router"
defined_in = "09-reviewer-companion-features-and-learnings.md#212-indexer-l0-and-l5"
from_task = "7a-E02-T01"

[[provides]]
name = "konfig-indexer"
kind = "config"
title = "services.indexer.mode and services.indexer.layers ([L0, L5] in 7a)"
defined_in = "09-reviewer-companion-features-and-learnings.md#7-configuration"
from_task = "7a-E02-T01"

[[provides]]
name = "schichtzustand-l0"
kind = "ts-api"
title = "LayerStateRow and needsRebuild(state, current, reachable) on kb_layer_state"
defined_in = "09-reviewer-companion-features-and-learnings.md#212-indexer-l0-and-l5"
from_task = "7a-E02-T01"

[[provides]]
name = "l5-inkrement"
kind = "ts-api"
title = "L5Increment, applyL5(inc), rebuildL5(repoId, at); watermark only after success, idempotency per merge SHA"
defined_in = "09-reviewer-companion-features-and-learnings.md#212-indexer-l0-and-l5"
from_task = "7a-E02-T02"

[[provides]]
name = "queue-indexer-l5"
kind = "queue"
title = "Queue indexer-l5 (singletonKey repoKey; applyL5 or onPrClosed)"
defined_in = "09-reviewer-companion-features-and-learnings.md#35-queues-pg-boss"
from_task = "7a-E02-T02"

[[provides]]
name = "metrik-und-alarm-schichten"
kind = "metric"
title = "guildwork.indexer.layer_failures and alert rule kb_layer_failed"
defined_in = "09-reviewer-companion-features-and-learnings.md#51-metrics-and-alarms"
from_task = "7a-E02-T02"

