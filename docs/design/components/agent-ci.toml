name = "konfig-agent-ci"
kind = "config"
title = "Configuration key security.agent_ci { mode, fork_owner }"
defined_in = "10-planner-architect-coder.md#7-configuration"
from_task = "2-E06-T02"

[[provides]]
name = "cli-agent-fork"
kind = "cli"
title = "guildwork agent-fork create --repo <r> [--fork-owner <o>] with the operator's token"
