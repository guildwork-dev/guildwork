id = "plugin-backend-ci-dispatch-github"
title = "ExecutionBackend ci-dispatch-github with runner workflow, OIDC login, nested sandbox and slot limit"
kind = "plugin"
path = "plugins/backend-ci-dispatch-github/"
package = "@guildwork/plugin-backend-ci-dispatch-github"
stage = "8"
purpose = "Starts work items as one-shot workers in GitHub Actions of a runner repo: plugin with dispatch and minting of the dispatch token, dispatcher job ci-dispatch-tick with the table dispatch_records in the control plane, template of the runner workflow, nested setup in the job, slot limit, expiry and metrics (ADR-45, FE-1350 to FE-1353). Not included: the OIDC login at the Work API (work-api), the mode --once (worker) and the broker profile dispatch (credential-broker)."
design = [
  "13-stage-8-providers-and-bases.md#25-backend-ci-dispatch-8-e05",
  "13-stage-8-providers-and-bases.md#251-plugin-and-configuration",
  "13-stage-8-providers-and-bases.md#252-broker-profile-dispatch-and-dispatch-app",
  "13-stage-8-providers-and-bases.md#253-runner-workflow-and-one-shot-worker",
  "13-stage-8-providers-and-bases.md#255-nested-setup",
  "13-stage-8-providers-and-bases.md#256-slot-limit-expiry-and-metrics",
  "13-stage-8-providers-and-bases.md#48-ci-dispatch",
  "13-stage-8-providers-and-bases.md#32-tables-of-stage-8",
  "13-stage-8-providers-and-bases.md#85-ci-dispatch-8-e05",
]
built_by = ["8-E05-T02", "8-E05-T03", "8-E05-T04", "8-E05-T05"]

[[provides]]
name = "executionbackend-dispatch"
kind = "contract"
title = "CiDispatchBackend (ExecutionBackend with dispatch): pools, maxConcurrency, dispatch(item) with workflow_dispatch and only item_hint, create returns unsupported; loaded only in the control plane"
defined_in = "13-stage-8-providers-and-bases.md#251-plugin-and-configuration"
from_task = "8-E05-T02"

[[provides]]
name = "dispatch-token"
kind = "ts-api"
title = "mintDispatchToken(pool): app JWT of the dispatch app, installation token only for runnerRepo with actions write, ScopedToken profile dispatch, TTL 300 s; the only caller is the broker"
defined_in = "13-stage-8-providers-and-bases.md#251-plugin-and-configuration"
from_task = "8-E05-T02"

[[provides]]
name = "konfig-pool"
kind = "config"
title = "pools[ci-dispatch]: CiDispatchPoolConfig (runnerRepo, workflow, ref, maxConcurrency, dispatchAppRef, oidc.*, isolation, claimTimeoutS, fallbackPool) and ci_dispatch.tick_s"
defined_in = "13-stage-8-providers-and-bases.md#251-plugin-and-configuration"
from_task = "8-E05-T02"

[[provides]]
name = "tabelle-dispatch-records"
kind = "table"
title = "dispatch_records (states requested to expired, oidc_jti unique) with the columns pools.health, pools.unhealthy_since and work_items.pool_alt, migration 0802_dispatch_records.sql"
defined_in = "13-stage-8-providers-and-bases.md#32-tables-of-stage-8"
from_task = "8-E05-T02"

[[provides]]
name = "dispatcher"
kind = "ts-api"
title = "CiDispatcher.tick(pool) as the job ci-dispatch-tick of the role orchestrator (apps/control-plane/src/ci-dispatch/dispatcher.ts)"
defined_in = "13-stage-8-providers-and-bases.md#252-broker-profile-dispatch-and-dispatch-app"
from_task = "8-E05-T02"

[[provides]]
name = "zustandsautomat"
kind = "ts-api"
title = "nextState(record, event, now, cfg) with DispatchRecord and DispatchEvent according to table 4.8"
defined_in = "13-stage-8-providers-and-bases.md#256-slot-limit-expiry-and-metrics"
from_task = "8-E05-T02"

[[provides]]
name = "audit-ci-dispatch"
kind = "event"
title = "Audit ci_dispatch.dispatched, ci_dispatch.refused, ci_dispatch.expired (item, pool, reason, fingerprint of the token)"
defined_in = "13-stage-8-providers-and-bases.md#34-events-and-audit-actions"
from_task = "8-E05-T02"

[[provides]]
name = "runner-workflow"
kind = "file"
title = "Template deploy/ci-dispatch/runner-workflow.yml with input item_hint, permissions id-token write, actions pinned by SHA"
defined_in = "13-stage-8-providers-and-bases.md#253-runner-workflow-and-one-shot-worker"
from_task = "8-E05-T03"

[[provides]]
name = "verschachtelter-aufbau"
kind = "file"
title = "deploy/ci-dispatch/nested: Compose file and up.sh with worker, egress proxy (the only exit) and sandbox on the internal network"
defined_in = "13-stage-8-providers-and-bases.md#255-nested-setup"
from_task = "8-E05-T04"

[[provides]]
name = "suite-s1-ci-dispatch"
kind = "file"
title = "eval/suites/s1/ci-dispatch with the case S1-ci-dispatch-nested-credential-scan and the checks (a) to (c)"
defined_in = "13-stage-8-providers-and-bases.md#87-suite-cases-of-stage-8"
from_task = "8-E05-T04"

[[provides]]
name = "slot-grenze"
kind = "ts-api"
title = "canDispatch(SlotState) with slot_limit or pool_unhealthy; expiry after claimTimeoutS, fallback pool via pool_alt"
defined_in = "13-stage-8-providers-and-bases.md#256-slot-limit-expiry-and-metrics"
from_task = "8-E05-T05"

[[provides]]
name = "konfig-grenzen"
kind = "config"
title = "ci_dispatch.claim_timeout_s and ci_dispatch.failure_alarm_count"
defined_in = "13-stage-8-providers-and-bases.md#7-configuration"
from_task = "8-E05-T05"

[[provides]]
name = "metriken"
kind = "metric"
title = "guildwork.ci_dispatch.wait (histogram, s), guildwork.ci_dispatch.active (gauge), guildwork.ci_dispatch.expired, guildwork.ci_dispatch.failed with status, guildwork.ci_dispatch.slot_full, each with pool"
defined_in = "13-stage-8-providers-and-bases.md#51-metrics-of-this-area"
from_task = "8-E05-T05"

[[provides]]
name = "alarm-ci-dispatch-failing"
kind = "event"
title = "Required alert ci_dispatch_failing after accumulated rejected dispatches; pool unhealthy until the next accepted dispatch"
defined_in = "13-stage-8-providers-and-bases.md#256-slot-limit-expiry-and-metrics"
from_task = "8-E05-T05"

