#
# OpenSSF Scorecard with SARIF upload, weekly and when the branch protection
# changes (architecture 12 section 5.2). Only in the public repository (rule
# public-only-guard of quality/ci/policy.toml); scheduled runs carry no event
# payload, so for them the repository variable GUILDWORK_VISIBILITY decides.
#
# publish_results: true makes the Scorecard API check this workflow and reject
# the results otherwise (README of ossf/scorecard-action v2.5.0, "Workflow
# Restrictions", read 2026-11-01): no top level env or defaults, no write
# permission at workflow level, id-token: write only in the job of the
# action; that job has no env, defaults, containers or services, runs on an
# Ubuntu hosted runner, and its steps use only actions/checkout,
# actions/upload-artifact, github/codeql-action/upload-sarif,
# ossf/scorecard-action and step-security/harden-runner. So: no run steps here.
#
# Actions are pinned to the commit of a release tag, read from the GitHub API
# of the vendor on 2026-11-01 (GET repos/<owner>/<repo>/git/ref/tags/<tag>,
# an annotated tag followed to its commit with GET git/tags/<sha>):
#   actions/checkout         v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact  v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   github/codeql-action     v4.39.1  9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   ossf/scorecard-action    v2.5.0   fa7117db83c52d787ae5a89f350999701505d78e

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.GUILDWORK_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      security-events: write # upload the results to code scanning
      id-token: write # OIDC token for publish_results: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
