interface = "contracts/grundtypen"
from_task = "2-E01-T10"
purpose = "Result in LockfileParser.parse"

[[uses]]
interface = "blueprint/blueprint-parser"
from_task = "2-E01-T10"
purpose = "blueprint.ecosystems with lockfile paths"

[[uses]]
interface = "contracts/vertrag-blob-store"
from_task = "2-E01-T10"
