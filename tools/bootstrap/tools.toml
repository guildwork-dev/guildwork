#
# Pinned tool binaries, fetched by tools/bootstrap/fetch.py into .tools/bin/ (FE-005).
#
# One table per tool:
#   version    exact release version
#   url        download URL template; {version} and {target} are replaced
#   member     path of the binary inside a .tar.gz archive; absent for a plain binary
#   target     the vendor's name of each platform, used for {target}
#   sha256     SHA-256 of the downloaded file per platform, copied from `source`
#   source     where the vendor publishes the checksums (checksum file or release page)
#   retrieved  date on which the checksums were copied from `source`
#
# Platforms: linux_x64, linux_arm64, darwin_arm64.
# A checksum is only ever copied from the vendor's published source, never
# computed locally. To update a tool, change version, sha256 and retrieved together.

# Checksums from the vendor file sha256.sum of the release.
[uv]
version = "0.13.5"
url = "https://github.com/astral-sh/uv/releases/download/{version}/uv-{target}.tar.gz"
member = "uv-{target}/uv"
source = "https://github.com/astral-sh/uv/releases/download/0.13.5/sha256.sum"
retrieved = "2026-11-01"
target = { linux_x64 = "x86_64-unknown-linux-gnu", linux_arm64 = "aarch64-unknown-linux-gnu", darwin_arm64 = "aarch64-apple-darwin" }
sha256 = { linux_x64 = "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f", linux_arm64 = "4bb69cf95ed13f23713bb7bc09f241896ea0c75b7c557e615a20604b82f9c403", darwin_arm64 = "743f85035a1996ecb350659e01cd9faea9709829be09b1b4b03c73eaf3c9cd73" }

