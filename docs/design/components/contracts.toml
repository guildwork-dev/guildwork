id = "contracts"
title = "Package contracts: base types, contracts v1alpha1, driver contracts, sketches, plugin and service manifest, Analyzer and WorkItemProvider contract"
kind = "package"
path = "packages/contracts/"
package = "@guildwork/contracts"
stage = "0"
purpose = "The only source of the types and schemas through which core, plugins, drivers and services talk to each other: base types, the eight binding contracts v1alpha1, sketches, plugin and service manifest with validation and later the binding contracts Analyzer and WorkItemProvider. Contains no network or database access; loader and transport are in plugin-rahmen, the event schema in event-schema, the harness in testkit."
