id = "auto-approve"
title = "Automatic approval of human PRs with withdrawal"
kind = "service"
path = "services/reviewer/src/autoapprove/"
package = "@guildwork/service-reviewer"
stage = "6"
purpose = "Detects agent PRs, decides deterministically after a full run on the approval of a human PR (conditions from ADR-61, no model), stores the decision, triggers the platform effects approve_human and withdraw_approve and shows why auto_approve has no effect. Not here: the executors approve_human and withdraw_approve (04), the SCM methods approve, withdrawApprove, approvalProtection (GitHub plugin) and the contract tests against GitHub."
design = [
  "09-reviewer-companion-features-and-learnings.md#29-automatic-approval-of-human-prs",
  "09-reviewer-companion-features-and-learnings.md#31-new-tables",
  "09-reviewer-companion-features-and-learnings.md#46-automatic-approval-and-withdrawal",
  "09-reviewer-companion-features-and-learnings.md#5-failure-and-abort-paths",
  "09-reviewer-companion-features-and-learnings.md#6-security",
  "09-reviewer-companion-features-and-learnings.md#81-stage-6-per-module",
]
built_by = ["6-E06-T04", "6-E06-T05", "6-E06-T06", "6-E06-T07", "6-E06-T08"]

