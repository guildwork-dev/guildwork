# Container images, pinned by digest (the multi-platform index; linux amd64 and
# arm64 are in it). Not fetched by fetch.py; the tool that runs an image reads
# its table. Keys: image (registry and repository), tag (the tag the digest was
# read from, for humans; only the digest is used), digest, source, retrieved.
#
# ScanCode Toolkit publishes no container image of its own (the release
# workflow at v32.5.0 builds none, and the vendor's registry has none). So
# `make scancode` runs the Docker Official Image of Python 3.12 and installs
# ScanCode into it from tools/bootstrap/scancode/requirements.txt (exact
# versions and hashes, the same as the local runner). Digest read from the
# registry (index of tag 3.12.15-slim-trixie, pushed 2026-10-22).
[images.scancode]
image = "docker.io/library/python"
tag = "3.12.15-slim-trixie"
digest = "sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704"
source = "https://hub.docker.com/_/python"
retrieved = "2026-11-01"
