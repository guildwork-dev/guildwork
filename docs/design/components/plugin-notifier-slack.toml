kind = "plugin"
path = "plugins/notifier-slack/"
package = "@guildwork/plugin-notifier-slack"
stage = "9"
purpose = "First notifier: messages and approval requests to Slack via the effect notify, signed callback that creates a control command of the linked SCM identity; with it the Notifier contract becomes binding. Not: approval directly in the callback, notifier Teams (FE-1248)."
