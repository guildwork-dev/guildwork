id = "prozess-abnahme-stufe-8"
title = "Documentation fixtures instead of accounts, optional owner runs, qualification, stage report and release for stage 8"
kind = "process"
path = "-"
stage = "8"
purpose = "Work without own product code: fixtures and cassettes from the public documentation for Jira and the cloud providers (O28, 13 FE-1366), runner repo and dispatch app on the owner's GitHub account, apply workflows; Jira test site, cloud accounts, real OpenTofu applies and qualification runs per combination only as optional owner runs; suites, stage report and signed release of stage 8. Builds no plugins or drivers; costs money only with the owner's go (O22)."
design = [
  "13-stage-8-providers-and-bases.md#28-owner-steps-and-decision-sheets",
  "13-stage-8-providers-and-bases.md#27-qualification-and-acceptance-8-e06",
  "13-stage-8-providers-and-bases.md#86-price-tables-qualification-acceptance-8-e06",
