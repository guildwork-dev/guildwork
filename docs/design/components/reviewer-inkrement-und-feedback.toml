from_task = "1-E04-T05"
purpose = "Dedupe with open findings"

[[uses]]
interface = "reviewer-router-und-budget/kontextpaket"
from_task = "1-E04-T05"
purpose = "open findings as part 7 of the context package"

[[uses]]
interface = "service-reviewer/review-pr-state"
from_task = "1-E04-T05"
purpose = "last_reviewed_sha, commits_since_full, last_full_review_sha"

[[uses]]
interface = "contracts/vertrag-scm-provider"
from_task = "1-E04-T06"
purpose = "getThreads with resolver, getPermission, getChange"

[[uses]]
