id = "eval-qualifikation"
title = "Qualification matrix, mode decision and reference qualification with remeasurement"
kind = "role"
path = "apps/control-plane/src/eval/matrix.ts"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Qualification matrix per qualification_key and scope with validity computed on every query, mode decision off, shadow, live including the marking default not proven, merge gate condition, adoption of the reference qualification with remeasurement in shadow and online decay (matrix.ts, reference.ts). Not for the measurement itself (eval service), the export of the file (eval-runner) or the profile (qualifikationsprofil)."
design = [
  "07-eval-and-qualification.md#211-qualification-matrix-and-mode-decision",
  "07-eval-and-qualification.md#212-reference-qualification",
  "07-eval-and-qualification.md#45-adoption-and-remeasurement",
  "07-eval-and-qualification.md#2165-eval-service-and-reference-service",
]
built_by = ["0-E20-T17", "0-E20-T18", "0-E20-T20"]

[[provides]]
name = "matrix"
kind = "ts-api"
title = "QualificationMatrix (row, decideMode, isQualifiedForMergeGate, evaluate) with MatrixRow and ModeDecision; contract test matrix.contract.test.ts for the policy"
defined_in = "07-eval-and-qualification.md#211-qualification-matrix-and-mode-decision"
from_task = "0-E20-T17"

[[provides]]
name = "audit-matrix"
kind = "event"
title = "Audit actions qualification.evaluated and qualification.unproven_live_used (per snapshot)"
defined_in = "07-eval-and-qualification.md#2165-eval-service-and-reference-service"
from_task = "0-E20-T17"

[[provides]]
name = "referenz-dienst"
kind = "ts-api"
title = "ReferenceService (adopt, rate, checkOnline) and job qualification-online-check"
defined_in = "07-eval-and-qualification.md#2165-eval-service-and-reference-service"
from_task = "0-E20-T20"

[[provides]]
name = "uebernahme-api"
kind = "http"
title = "POST /admin/api/v1/qualification/adopt (admin) and POST /admin/api/v1/eval/shadow-ratings (approver)"
defined_in = "07-eval-and-qualification.md#26-eval-service-and-runner"
from_task = "0-E20-T20"

[[provides]]
name = "audit-uebernahme"
kind = "event"
title = "Audit actions qualification.adopted, qualification.adopt_rejected, qualification.adoption_expired, qualification.rating_added"
defined_in = "07-eval-and-qualification.md#2165-eval-service-and-reference-service"
from_task = "0-E20-T20"

[[provides]]
