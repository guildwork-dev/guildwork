id = "plugin-codex"
title = "AgentRuntime codex with credential kinds openai and chatgpt"
kind = "plugin"
path = "plugins/codex/"
package = "@guildwork/plugin-codex"
stage = "8"
purpose = "Second harness: adapter for Codex CLI (codex exec --json --output-schema) as AgentRuntime with install via PinnedVersion, event mapping, credential kind openai via the relay and chatgpt as an operator mode (FE-1229, FE-1330 to FE-1332). Not included: the resolver rule checkCodexCredentials (provider config-resolver-regeln/codex-credentials, built in the same task), the CLI itself (loaded at the operator, never into the image), the relay extension by upstreamKind openai and the price calculation (FE-1360)."
design = [
  "13-stage-8-providers-and-bases.md#23-harness-codex-8-e03",
  "13-stage-8-providers-and-bases.md#231-manifest-and-capabilities",
  "13-stage-8-providers-and-bases.md#232-install",
  "13-stage-8-providers-and-bases.md#233-run-and-event-mapping",
  "13-stage-8-providers-and-bases.md#234-credential-kinds-openai-and-chatgpt",
  "13-stage-8-providers-and-bases.md#235-contract-suite-codex",
  "13-stage-8-providers-and-bases.md#46-codex-run",
  "13-stage-8-providers-and-bases.md#83-codex-8-e03",
]
built_by = ["8-E03-T01", "8-E03-T02", "8-E03-T03", "8-E03-T04"]

[[provides]]
name = "spike-bericht"
kind = "file"
title = "eval/reports/spike-codex.md: verified start paths, event names, switches, pinned version and checksum for the contract suite"
defined_in = "13-stage-8-providers-and-bases.md#10-open-points"
from_task = "8-E03-T01"

[[provides]]
name = "agentruntime"
kind = "contract"
title = "AgentRuntime codex: supports per credential kind with conditions, install (checksum, codex --version), run with mapping to RuntimeEvent, AgentRunResult with cost.source price_table without usd; capability table"
defined_in = "13-stage-8-providers-and-bases.md#231-manifest-and-capabilities"
from_task = "8-E03-T02"

[[provides]]
name = "konfig-runtime"
kind = "config"
title = "Runtime with harness codex: CodexRuntimeConfig (pin, sandboxMode from nativeTools, credential, reasoningEffort), harness_pins.codex, runtimes[].reasoning_effort"
defined_in = "13-stage-8-providers-and-bases.md#231-manifest-and-capabilities"
from_task = "8-E03-T02"

[[provides]]
name = "credential-openai"
kind = "contract"
title = "Start path openai: grant openai from runtimes[].credential.ref, relay registration with upstreamKind openai, base URL and placeholder in the sandbox"
defined_in = "13-stage-8-providers-and-bases.md#234-credential-kinds-openai-and-chatgpt"
from_task = "8-E03-T03"

[[provides]]
name = "konfig-chatgpt"
kind = "config"
title = "credentials.chatgpt.auth_file in worker.yaml (FE-1332); acknowledge_terms comes from config-resolver-regeln/personal-modes-konfig"
defined_in = "13-stage-8-providers-and-bases.md#234-credential-kinds-openai-and-chatgpt"
from_task = "8-E03-T03"

[[provides]]
name = "contract-suite"
kind = "file"
title = "Contract suite codex: transcripts under plugins/codex/contract/transcripts, replay program packages/testkit/src/contract/fake-codex, attestation with fixturesHash as a load condition"
defined_in = "13-stage-8-providers-and-bases.md#235-contract-suite-codex"
from_task = "8-E03-T04"

