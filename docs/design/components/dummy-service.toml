id = "dummy-service"
title = "Dummy service end to end with failure paths"
kind = "service"
path = "services/dummy/"
package = "@guildwork/service-dummy"
stage = "0"
purpose = "Service without domain logic and without an LLM (default) that proves the whole chain of stage 0 from the comment to the effect in mode record, with a harness mode against a fake upstream, the end-to-end tests of the failure paths and the probe run of the assistant; never live (policy dummy.never_live)."
design = ["06-installation-operations-ui.md#28-dummy-service", "06-installation-operations-ui.md#42-dummy-service-end-to-end", "06-installation-operations-ui.md#85-dummy-service-end-to-end", "06-installation-operations-ui.md#5-failure-and-abort-paths"]
