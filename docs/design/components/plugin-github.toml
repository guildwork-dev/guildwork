id = "plugin-github"
title = "GitHub plugin: manifests, client, auth, contract fixtures"
kind = "plugin"
path = "plugins/github/"
package = "@guildwork/plugin-github"
stage = "0"
purpose = "Shared part of the two GitHub packages github (TriggerSource, SCMProvider) and github-issues (WorkItemProvider): manifests, instance configuration, own REST and GraphQL client on ctx.http, app JWT, token per permission profile, app creation via manifest flow and the recorded contract fixtures. Runs only in the control plane (FE-515); trigger, SCM methods and issues are in separate components."
design = [
  "05-plugins-and-contracts.md#214-github-plugin",
  "05-plugins-and-contracts.md#2141-manifests-and-configuration-ruling-fe-513",
  "05-plugins-and-contracts.md#2142-client-and-error-mapping-ruling-fe-514",
  "05-plugins-and-contracts.md#2145-auth-app-jwt-minttoken-permission-profiles-clonespec",
  "05-plugins-and-contracts.md#2149-github-app-via-manifest-flow-adr-45-ruling-fe-517",
  "05-plugins-and-contracts.md#21410-diagnostic-reads-for-doctor-ruling-fe-557",
  "05-plugins-and-contracts.md#34-fixtures-of-the-github-plugin-pluginsgithubcontractfixtures",
  "05-plugins-and-contracts.md#43-token-per-effect",
  "05-plugins-and-contracts.md#47-github-app-via-manifest-flow",
]
built_by = [
  "0-E14-T01",
