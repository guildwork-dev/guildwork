id = "ui-betrieb"
title = "Operations pages of the admin UI: status, telemetry, pools, services, audit, costs, alerts"
kind = "ui"
path = "apps/admin-ui/src/pages/"
package = "@guildwork/admin-ui"
stage = "0"
purpose = "Read-only operations views with their admin endpoints: status with version age and audit anchor, pools with checked capabilities, services with qualification, audit with chain status, costs from the ledger and the alerts page; not the alert API itself (alarm-automat, area 00), not the telemetry opt-ins (produkt-telemetrie) and not Run Record or kill switch."
