id = "worker-harness-umgebung"
title = "Harness environment from allowlist and start path subscription in the worker"
kind = "role"
path = "apps/worker/src/harness/"
package = "@guildwork/worker"
stage = "0"
area = "03"
purpose = "Builds in the worker the environment of the harness process from an empty environment and an allowlist per credential kind, reads the subscription token per item from the host file of the operator and gives the runtime the harness cache directory of the worker host (copied in via copyIn, FE-333). Does not start the harness itself (that is done by the runtime plugin via the item lifecycle) and stores no credential."
design = [
  "03-execution.md#211-harness-environment-and-start-path-subscription-worker-side",
  "03-execution.md#27-sandbox-executionbackend-docker-sysbox-and-docker-gvisor",
  "03-execution.md#2111-runtime-and-modelprovider-in-the-worker-05-fe-550-fe-551-fe-339",
]
built_by = ["0-E12-T08"]

[[provides]]
name = "build-harness-env"
kind = "ts-api"
title = "buildHarnessEnv(HarnessEnvInput): environment from allowlist per credential kind, runtimeExtra checked against credential patterns; called from the spawn wrapper for AgentRuntime and ModelProvider (05 FE-550); kinds of stage 8 per 13 section 2.2.5 (FE-1323)"
defined_in = "03-execution.md#211-harness-environment-and-start-path-subscription-worker-side"
from_task = "0-E12-T08"

[[provides]]
