id = "plugin-model-bedrock"
title = "ModelProvider bedrock"
kind = "plugin"
path = "plugins/model-bedrock/"
package = "@guildwork/plugin-model-bedrock"
stage = "8"
purpose = "ModelProvider for single calls via Amazon Bedrock (Vercel AI SDK), executed in the worker as work item model_call, access via the grant bedrock and the relay with SigV4 or in passthrough (FE-1327). Not included: the start path bedrock of the harness claude-code, the STS identity (driver-identity-aws) and the relay extension."
design = [
  "13-stage-8-providers-and-bases.md#226-modelprovider-bedrock-vertex-and-foundry",
  "13-stage-8-providers-and-bases.md#45-start-with-bedrock-vertex-and-foundry",
  "13-stage-8-providers-and-bases.md#82-providers-8-e02",
]
built_by = ["8-E02-T04"]

