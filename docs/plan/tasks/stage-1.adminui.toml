  "Test 'killswitch.lift-does-not-resume' green",
  "Test 'killswitch.approver-can-activate-admin-lifts' green",
  "Test 'killswitch.audit-and-alarm' green",
]
sources = ["06 section 6", "03 sections 4 and 5", "08 stage 1"]
depends_on = ["0-E17", "0-E04", "0-E05", "0-E11", "0-E19"]
