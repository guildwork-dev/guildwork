id = "identitaetsverknuepfung"
title = "identity_links via OAuth confirmation with a UI page"
kind = "role"
path = "apps/control-plane/src/identity/"
package = "@guildwork/control-plane"
stage = "8"
purpose = "Links an account of a ticket system (Jira) with an SCM account (GitHub) only through OAuth confirmation of both sides by the user themselves, with the page Link accounts, revocation and audit (FE-1225, FE-1312, FE-1313). Not included: the permission AND check in the router, which only calls resolve, and the base model of the tables identities and identity_links (01)."
design = [
  "13-stage-8-providers-and-bases.md#216-identity-linking",
  "13-stage-8-providers-and-bases.md#43-identity-linking",
  "13-stage-8-providers-and-bases.md#32-tables-of-stage-8",
]
built_by = ["8-E01-T07"]

[[provides]]
name = "identity-link-service"
kind = "ts-api"
title = "IdentityLinkService: start, callback, resolve(workItemInstance, accountId) only active ones, listOwn, listAll, revoke; types IdentityLink, IdentityLinkStep, IdentityLinkError, OAuthIdentityClient"
defined_in = "13-stage-8-providers-and-bases.md#216-identity-linking"
from_task = "8-E01-T07"

[[provides]]
name = "http-identity-links"
kind = "http"
title = "Admin API /admin/api/v1/identity-links: GET own ones or scope=all, POST /flows starts a flow, DELETE /{id} revokes with a reason"
defined_in = "13-stage-8-providers-and-bases.md#216-identity-linking"
from_task = "8-E01-T07"

[[provides]]
name = "http-oauth-rueckruf"
kind = "http"
title = "Browser callbacks GET /admin/oauth/identity-link/atlassian/callback and /github/callback with code and state"
defined_in = "13-stage-8-providers-and-bases.md#216-identity-linking"
from_task = "8-E01-T07"

[[provides]]
name = "ui-konten-verknuepfen"
kind = "ui"
title = "Admin UI page Link accounts under /admin/identity-link (start, own links, revocation; all of them for admin) with error pages; target of the link on identity_not_linked"
defined_in = "13-stage-8-providers-and-bases.md#216-identity-linking"
from_task = "8-E01-T07"

[[provides]]
name = "tabelle-identity-link-flows"
kind = "table"
title = "identity_link_flows (open flows, at most 15 minutes) and column identity_links.revoked_by, migration 0801_identity_links.sql"
defined_in = "13-stage-8-providers-and-bases.md#32-tables-of-stage-8"
from_task = "8-E01-T07"

[[provides]]
name = "konfig-identity-link"
kind = "config"
title = "identity_link.oauth.atlassian, identity_link.oauth.github (client_id_ref, client_secret_ref) and identity_link.flow_ttl_s; without OAuth values or without WRITE on the SecretStore the page is off"
defined_in = "13-stage-8-providers-and-bases.md#7-configuration"
from_task = "8-E01-T07"

[[provides]]
name = "audit-identity-link"
kind = "event"
title = "Audit identity.link_started, identity.linked, identity.link_failed, identity.revoked"
defined_in = "13-stage-8-providers-and-bases.md#34-events-and-audit-actions"
from_task = "8-E01-T07"

