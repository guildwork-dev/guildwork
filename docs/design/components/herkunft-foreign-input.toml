id = "herkunft-foreign-input"
title = "Provenance attribute foreign_input_seen"
kind = "role"
path = "apps/control-plane/src/provenance/"
package = "@guildwork/control-plane"
stage = "2"
purpose = "Records in the control plane every untrusted input from a person that a service sees in the run, computes with a fresh permission query whether it is foreign, and sets runs.foreign_input_seen; QA and PR-Fixer report their inputs via the same service. Not: the block in the merge gate (stage 5) and no inputs without a person (code, CI logs, SARIF)."
design = ["10-planner-architect-coder.md#28-origin-attribute-foreign_input_seen-adr-60", "10-planner-architect-coder.md#219-endpoints"]
built_by = ["2-E01-T12", "3-E01-T08", "4-E01-T03"]

[[provides]]
name = "provenance-dienst"
kind = "ts-api"
title = "ProvenanceService.record and permissionOf: computation of foreign, writing of run_untrusted_inputs, setting of runs.foreign_input_seen"
defined_in = "10-planner-architect-coder.md#28-origin-attribute-foreign_input_seen-adr-60"
from_task = "2-E01-T12"

[[provides]]
name = "untrusted-inputs-endpunkt"
kind = "http"
title = "POST /work/v1/leases/{leaseId}/untrusted-inputs (connection of the UntrustedReporter in the worker)"
