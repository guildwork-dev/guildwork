id = "portabilitaetstest"
title = "Portability test: installation, upgrade N-1, backup and restore, air gap, PITR"
kind = "tool"
path = "tools/portability/"
stage = "0"
purpose = "Reusable workflow portability.yml with scripts that installs, checks, upgrades, backs up and restores every release candidate on fresh runners (amd64, arm64; gVisor, Sysbox) using only documented commands, plus air gap, telemetry default and PITR; only checks, delivers nothing."
design = ["06-installation-operations-ui.md#213-portability-test-and-s8", "06-installation-operations-ui.md#218-check-tools-for-release-portability-and-acceptance"]
built_by = ["0-E21-T05", "0-E21-T06", "0-E21-T08", "0-E22-T06"]

[[provides]]
name = "portability-workflow"
kind = "file"
title = "portability.yml (workflow_call from release.yml): matrix amd64 gvisor, arm64 gvisor, amd64 sysbox; host-prepare, install, doctor --strict, smoke; log as an artifact"
defined_in = "06-installation-operations-ui.md#213-portability-test-and-s8"
from_task = "0-E21-T05"

[[provides]]
name = "smoke"
kind = "cli"
title = "tools/portability/smoke.py: signed webhook, run done, effect shadowed, Run Record complete"
