#
# Exceptions of the deny-list scanner (tools/denylist/scan.py), one per finding
# id and exact line, never per file (FE-023). A finding prints its id; the
# report written with --json holds the line_sha256 of the line. The reason
# names the pull request that accepted the exception. The text rule
# instance-data (tools/hooks/text_rules.py) applies the same exceptions.
#
# [[exception]]
#   term         finding id: term-<sha256 of the list entry, 12 hex> or generic-<rule>
#   line_sha256  SHA-256 of the exact line in UTF-8, without the line break
#   path         path of the file in the repository
#   reason       why the line may stay

