  "09-reviewer-companion-features-and-learnings.md#42-reply-in-the-thread",
  "09-reviewer-companion-features-and-learnings.md#43-pause-and-resume",
  "09-reviewer-companion-features-and-learnings.md#48-learning-lifecycle",
  "09-reviewer-companion-features-and-learnings.md#81-stage-6-per-module",
]
