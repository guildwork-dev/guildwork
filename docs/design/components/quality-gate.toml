purpose = "Decides from analyzer reports and metrics according to analysis.gate whether a head SHA passes the platform gate, and delivers the text of the check quality-gate; from stage 5 on, the merge gate reads the same decision. Not: running the analyzers (analyzer-runner) and not setting the check (coder via propose_check)."
