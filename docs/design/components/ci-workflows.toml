id = "ci-workflows"
title = "CI workflow set with ci-ok as the only required check, Renovate configuration, CI measurement"
kind = "tool"
path = ".github/workflows/"
stage = "R"
purpose = "The workflow set of the product repo: ci.yml with the job split ts, tools, security and ci-ok as the only required check, CodeQL, Scorecard, daily full scans of main (vulnerabilities and ScanCode), Renovate configuration and the measurement of waiting time and concurrency. Not the release, portability and acceptance workflows of later stages and not the deny jobs (denylist-scanner)."
design = ["00-codebase-and-conventions.md#211-ci-workflows", "00-codebase-and-conventions.md#42-ci-run-and-ci-ok", "00-codebase-and-conventions.md#210-check-tools"]
built_by = ["R-E03-T01", "R-E03-T02", "R-E03-T03", "R-E03-T04", "R-E05-T04", "R-E05-T10"]

[[provides]]
name = "ci-yml"
kind = "file"
title = ".github/workflows/ci.yml: triggers, concurrency, jobs ts, tools, security, ci-ok; later tasks add further jobs"
defined_in = "00-codebase-and-conventions.md#211-ci-workflows"
from_task = "R-E03-T01"

[[provides]]
name = "ci-ok"
kind = "cli"
title = "Required check ci-ok: tools/ci/ci_ok.py evaluates NEEDS_JSON according to the decision table"
defined_in = "00-codebase-and-conventions.md#42-ci-run-and-ci-ok"
from_task = "R-E03-T01"

[[provides]]
name = "sicherheits-workflows"
kind = "file"
title = "codeql.yml and scorecard.yml (public only, visibility guard), advisories.yml (daily, jobs osv-full and scancode)"
defined_in = "00-codebase-and-conventions.md#211-ci-workflows"
from_task = "R-E03-T03"

[[provides]]
name = "renovate-json"
kind = "file"
title = "renovate.json with waiting time, grouping, digest pins, regex manager for tools.toml, without lock file maintenance; schema check in make workflows (check-jsonschema --builtin-schema vendor.renovate)"
defined_in = "00-codebase-and-conventions.md#211-ci-workflows"
from_task = "R-E03-T04"

[[provides]]
name = "beleg-erste-laeufe"
kind = "file"
title = "Evidence publish/evidence/R-first-push.txt: first runs on main green"
defined_in = "00-codebase-and-conventions.md#211-ci-workflows"
from_task = "R-E05-T04"

[[provides]]
name = "measure-queue"
kind = "cli"
title = "tools/ci/measure_queue.py: waiting time and concurrent PR runs (GET only), measured values in push-discipline.md"
defined_in = "00-codebase-and-conventions.md#210-check-tools"
from_task = "R-E05-T10"

[[provides]]
name = "junit-artefakte"
kind = "file"
title = "JUnit reports of the jobs ts, tools, security as artifacts junit-<job> (also on a red run), Python runner tools/ci/junit_unittest.py in the gate test-tools (FE-062)"
defined_in = "00-codebase-and-conventions.md#211-ci-workflows"
from_task = "R-E03-T01"

[[provides]]
name = "commit-range"
kind = "cli"
title = "tools/ci/commit_range.py: COMMIT_RANGE per event (PR base..head, push before..after, first push after, otherwise origin/main..HEAD), only from the environment"
defined_in = "00-codebase-and-conventions.md#210-check-tools"
from_task = "R-E03-T02"

