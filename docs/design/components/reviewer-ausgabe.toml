id = "reviewer-ausgabe"
title = "Output on GitHub: rendering, review, summary, check ai-review, threads, status row"
kind = "service"
path = "services/reviewer/src/controller/post/"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Builds from verified rows in findings the write requests review, check and thread_resolve to the Effect Gateway, the summary, the check ai-review without silent green and the status row; in shadow mode the effects land in the eval log. The executors themselves belong to the Effect Gateway (1-E05-T08 to 1-E05-T11)."
design = [
  "08-reviewer.md#413-output-on-github",
  "08-reviewer.md#35-markers-in-comments",
  "08-reviewer.md#5-failure-and-abort-paths",
  "08-reviewer.md#82-contract-and-integration-tests",
  "11-qa-prfix-automerge.md#23-qa",
]
built_by = ["1-E05-T01", "1-E05-T02", "1-E05-T03", "1-E05-T04", "1-E05-T05", "1-E05-T06", "1-E05-T07", "3-E06-T02", "10-E04-T02"]

[[provides]]
name = "kommentar-marker"
kind = "file"
title = "Marker gw:f=<fingerprint> in inline comments and gw:r=<runId> in thread replies; summary marker from the executor"
defined_in = "08-reviewer.md#35-markers-in-comments"
from_task = "1-E05-T01"

[[provides]]
name = "review-vorschlag"
kind = "contract"
title = "Write request review variant review per run (proposalKey review:<headSha>) and evaluation of ReviewOutcome (FE-839)"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T02"

[[provides]]
name = "zusammenfassung"
kind = "contract"
title = "Summary via review variant summary with content 1 to 9, separate from the status comment (FE-819)"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T03"

[[provides]]
name = "check-ai-review"
kind = "contract"
title = "Check run ai-review: queued, in_progress, completed; conclusion and CheckReason according to FE-815, check.fail_on"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T04"

[[provides]]
name = "thread-aufloesung"
kind = "contract"
title = "Write request thread_resolve with replyMd for addressed and outdated, resolution only without a human reply"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T05"

[[provides]]
name = "statuszeile"
kind = "contract"
title = "Note of the reviewer run in the status comment via ControllerHost.statusRow (ReviewerStatusNote) and reply texts ReviewerReplyKey via ReviewerHost.reply (FE-849)"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T06"

[[provides]]
name = "schattenbetrieb"
kind = "contract"
title = "Shadow mode: all steps the same, effects shadowed in the eval log, findings and review_pr_state written anyway"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "1-E05-T07"

[[provides]]
name = "abschnitt-mutanten"
kind = "contract"
title = "Section Surviving mutants in the summary from findings with source qa:mutant, never inline"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "3-E06-T02"

[[provides]]
name = "werkzeug-kontext"
kind = "ts-api"
title = "Section Tool context of the summary: ToolContextRenderer per properties bag, renderToolContext, never in the prompt (15 K12, FE-1528)"
defined_in = "08-reviewer.md#413-output-on-github"
from_task = "10-E04-T02"

