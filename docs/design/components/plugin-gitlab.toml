id = "plugin-gitlab"
title = "GitLab: ingress, reading, writing"
kind = "plugin"
path = "plugins/gitlab/"
package = "@guildwork/plugin-gitlab"
stage = "9"
purpose = "GitLab as the second code hoster with TriggerSource, SCMProvider and WorkItemProvider (issues) in the control plane, review output via the fallback chain and the weak token tier in the broker. Not: merge or auto-approve (FE-1446), CI dispatch for GitLab (FE-1447)."
design = [
  "14-stage-9-breadth-and-hardening.md#211-common-host-framework",
  "14-stage-9-breadth-and-hardening.md#212-gitlab",
  "14-stage-9-breadth-and-hardening.md#217-weak-token-tier-in-the-credential-broker",
  "14-stage-9-breadth-and-hardening.md#218-spike-and-test-accounts",
  "14-stage-9-breadth-and-hardening.md#41-host-inbound-with-signature-tier",
  "14-stage-9-breadth-and-hardening.md#42-review-output-via-the-fallback-chain",
  "14-stage-9-breadth-and-hardening.md#412-states",
  "14-stage-9-breadth-and-hardening.md#81-code-hosts-9-e01",
]
built_by = ["9-E01-T02", "9-E01-T03", "9-E01-T04"]

