from_task = "0-E14-T13"

[[provides]]
name = "client"
kind = "ts-api"
title = "Shared GitHub client in plugins/github/src/client/ (REST with pinned API version, GraphQL, pagination, error mapping per 2.7, RateLimitSnapshot) on ctx.http for trigger, SCM and issues"
