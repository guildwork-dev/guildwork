id = "lizenz-gate"
title = "License gate: SPDX headers, allowlist, ScanCode, THIRD_PARTY_NOTICES, toolchain.md"
kind = "tool"
path = "tools/ci/license_check.py"
stage = "R"
purpose = "Keeps the license situation of the repo verifiable: LICENSE checksum, SPDX headers, licenses of all dependencies against the allowlist, license texts, ADR-39 counter-test in the lockfile, THIRD_PARTY_NOTICES, ScanCode before release; plus the verified license list of the tools. Not the license gate of the images (release-werkzeuge, 0-E21)."
design = ["00-codebase-and-conventions.md#210-check-tools", "00-codebase-and-conventions.md#23-toolchain", "00-codebase-and-conventions.md#212-code-conventions"]
built_by = ["R-E01-T07", "R-E02-T06", "R-E02-T07"]

[[provides]]
name = "toolchain-md"
kind = "file"
title = "docs/quality/toolchain.md: license, source location and retrieval date per tool and library"
defined_in = "00-codebase-and-conventions.md#23-toolchain"
from_task = "R-E01-T07"

[[provides]]
name = "lizenz-listen"
kind = "file"
title = "quality/licenses/allowed.txt and dev-exceptions.txt (allowlist from 12 section 5.2, exceptions with a reason)"
defined_in = "00-codebase-and-conventions.md#210-check-tools"
from_task = "R-E01-T07"

[[provides]]
name = "make-licenses"
kind = "cli"
title = "make licenses (license_check.py, six checks)"
defined_in = "00-codebase-and-conventions.md#210-check-tools"
from_task = "R-E02-T06"

[[provides]]
name = "spdx-kopf"
kind = "file"
title = "Required header SPDX-License-Identifier and SPDX-FileCopyrightText, extension list and line limit in tools/ci/spdx_header.py, exceptions and adopted files in quality/licenses/header.toml"
defined_in = "00-codebase-and-conventions.md#212-code-conventions"
from_task = "R-E02-T06"

[[provides]]
name = "third-party-notices"
kind = "file"
title = "THIRD_PARTY_NOTICES, generated by third_party_notices.py (make notices, --check in the gate)"
defined_in = "00-codebase-and-conventions.md#24-make-targets"
from_task = "R-E02-T06"

[[provides]]
name = "make-scancode"
kind = "cli"
title = "make scancode: ScanCode over the files of HEAD (raw, not git archive) with scancode_policy.py and scancode-exceptions.txt"
defined_in = "00-codebase-and-conventions.md#24-make-targets"
from_task = "R-E02-T07"

[[uses]]
interface = "repo-geruest-und-toolchain/ts-toolchain"
from_task = "R-E01-T07"
purpose = "List of the TypeScript tools and runtime libraries whose license is checked"

[[uses]]
interface = "repo-geruest-und-toolchain/community-dateien"
from_task = "R-E02-T06"
purpose = "Check LICENSE, NOTICE, LICENSES/ and quality/licenses/license.sha256"

[[uses]]
interface = "repo-geruest-und-toolchain/python-toolchain"
from_task = "R-E02-T06"
purpose = "uv.lock as the source of the Python dependencies"

[[uses]]
interface = "repo-geruest-und-toolchain/gates-toml"
from_task = "R-E02-T06"
purpose = "Register the gate licenses and the target notices"

[[uses]]
interface = "repo-geruest-und-toolchain/tools-toml"
from_task = "R-E02-T07"
purpose = "ScanCode image by digest from tools.toml"
