#
# SPDX header rules of the license gate (tools/ci/license_check.py).
#
# The header text, the comment form per suffix or file name and the line limit
# live only in tools/ci/spdx_header.py (FE-053). Files whose suffix or name has
# no comment form there (NOTICE, *.sha256, .gitignore, for instance) are not
# checked; the gate checks every other tracked or untracked, not ignored file.
#
# [exempt]
#   paths      globs (`**/` any directories, `*` within one path part) of files
#              that carry no header. Files without a comment form are listed
#              too where the decision should be visible.
# [[adopted]]  a file adopted from another project under a license that is not
#              in allowed.txt. The file carries the header of its source with an
#              Origin line (architecture 12 section 2.4); adopted files under a
#              license from allowed.txt need no entry.
#   path       exact path of the file
#   license    the SPDX expression of its header, exactly
#   reason     why the license is accepted for this file (not empty)

[exempt]
paths = [
  # License texts must stay verbatim (REUSE, FE-029).
  "LICENSE",
  "LICENSES/**",
  # Legal notice reproduced verbatim by redistributors; no comment syntax.
  "NOTICE",
  # Generated by tools/ci/third_party_notices.py.
  "THIRD_PARTY_NOTICES",
  # sha256sum format: a comment line would break `sha256sum -c`.
  "quality/licenses/license.sha256",
  # Generated lockfiles.
  "**/pnpm-lock.yaml",
  "uv.lock",
  # JSON has no comments.
  "**/*.json",
  # Test inputs must stay exactly as the case needs them.
  "**/fixtures/**",
]

[[adopted]]
path = "CODE_OF_CONDUCT.md"
license = "CC-BY-SA-4.0"
reason = "Contributor Covenant 3.0, adapted under its license CC-BY-SA-4.0, which requires the adaptation to keep that license; the text is not code and not shipped in images. License text LICENSES/CC-BY-SA-4.0.txt from spdx/license-list-data v3.29.0, retrieved 2026-11-01."
