id = "plugin-incident-handoff"
title = "Generic signed webhook incident-handoff"
kind = "plugin"
path = "plugins/incident-handoff/"
package = "@guildwork/plugin-incident-handoff"
stage = "10"
purpose = "TriggerSource for handoffs from monitoring and incident tools via Standard Webhooks signature; in addition the handoff in the control plane (incident/intake), which creates at most one ticket or, via a route with a responsible person, a fix job. No dedicated SRE agent (ADR-49); the sender never gets write permission."
design = [
  "15-stage-10-edge-layers.md#25-intake-incident-handoff-and-sentry-10-e03",
  "15-stage-10-edge-layers.md#251-plugin-incident-handoff",
  "15-stage-10-edge-layers.md#253-route-with-a-responsible-person-and-handover",
  "15-stage-10-edge-layers.md#47-incident-handoff",
  "15-stage-10-edge-layers.md#6-security",
  "15-stage-10-edge-layers.md#83-incident-handoff-10-e03",
]
built_by = ["10-E03-T01", "10-E03-T03"]

