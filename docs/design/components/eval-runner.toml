id = "eval-runner"
title = "Eval runner CLI: validate-set, client, fetcher with pins, label tool, export; plus check tool tools/check-eval-data"
kind = "eval"
path = "eval/runner/"
package = "@guildwork/eval-runner"
stage = "0"
purpose = "Command guildwork-eval as a client without own permissions: check sets, load and check pinned sources, prepare cases and start and query runs via the eval API, calibrate, label, export the reference qualification; plus the check tool against third-party data in the repo. Not for admission, run state machine or matrix (server-side in the eval service, FE-700) and not for the installer command guildwork (FE-730)."
design = [
  "07-eval-and-qualification.md#26-eval-service-and-runner",
  "07-eval-and-qualification.md#23-download-and-pins",
  "07-eval-and-qualification.md#6-security",
  "07-eval-and-qualification.md#212-reference-qualification",
  "07-eval-and-qualification.md#2175-runner-authentication-at-the-eval-api",
  "07-eval-and-qualification.md#2176-label-tool-and-calibration"
]
built_by = ["0-E20-T01", "0-E20-T09", "0-E20-T10", "0-E20-T11", "0-E20-T12", "0-E20-T15", "0-E20-T16", "0-E20-T18", "0-E20-T24"]

