id = "db"
title = "Package db: connection, tenant context with RLS, Kysely types, repositories"
kind = "package"
path = "packages/db/"
package = "@guildwork/db"
stage = "0"
purpose = "Sole access of the control plane and the eval service to Postgres: connection per role, tenant context with row-level security, installation scope with a fixed list of callers, Kysely types, thin repositories and the maintenance jobs for partitions and retention. Not here: domain logic, state transitions and audit chain (belong to the users or to 04), migrator and migration files 0001 to 0008 (db-migrator, db-schema-kern), queues (db-queue)."
design = ["01-data-model.md#2-modules-and-responsibility", "01-data-model.md#21-audit-port-locks-and-test-callback", "01-data-model.md#22-maintenance-jobs", "01-data-model.md#23-repository-framework", "01-data-model.md#24-metrics", "01-data-model.md#310-partitioning-and-maintenance-functions-migration-0009", "01-data-model.md#311-retention-and-deletion", "01-data-model.md#43-tenant-context", "01-data-model.md#6-security", "01-data-model.md#7-configuration"]
built_by = ["0-E02-T01", "0-E02-T08", "0-E02-T09", "0-E02-T10", "0-E02-T11", "8-E01-T07"]

