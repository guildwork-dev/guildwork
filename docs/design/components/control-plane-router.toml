id = "control-plane-router"
title = "Router: filter stages, repo assignment, route selection, permission check G0"
kind = "role"
path = "apps/control-plane/src/router/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Assigns every new event to a route: cheap filters, repo assignment, fresh re-read against TOCTOU, configuration at the base SHA, route selection with deny by default and permission check G0 at the provider; the result is a RouteDecision or a skipped event. Creates no run and knows no object lock (FE-210); later stages only add routes, arguments and permission forms here."
design = [
  "02-control-plane.md#43-router",
  "02-control-plane.md#3-data",
  "02-control-plane.md#5-failure-and-abort-paths",
]
built_by = [
  "0-E04-T05",
  "0-E04-T06",
  "1-E08-T04",
  "2-E07-T02",
  "4-E01-T03",
  "5-E04-T01",
  "6-E03-T01",
  "6-E06-T07",
  "8-E01-T08",
  "9-E06-T05",
  "10-E02-T01",
  "10-E03-T01",
  "2-E04-T10",
]

