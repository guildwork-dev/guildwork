id = "service-coder"
title = "Coder: agent phases, self-review, commits and bundle, draft PR, L1, L2, L4"
kind = "service"
path = "services/coder/"
package = "@guildwork/service-coder"
stage = "2"
purpose = "Implements an approved plan (or a ticket with --no-plan) in a sandbox with write and shell rights, checks itself, normalizes commits, builds bundle and PR text and reports push and draft PR as write requests; in addition clarifying question (L1), steering (L2) and agent-led environment setup (L4). Not: self-check bundle (coder-self-check), hard gates and G4 (coder-harte-gates), orchestrator effects such as agent-approval-check (orchestrator-effekte)."
design = ["10-planner-architect-coder.md#213-coder-servicescoder", "10-planner-architect-coder.md#44-coder-run", "10-planner-architect-coder.md#45-question-and-continuation-l1", "10-planner-architect-coder.md#46-steering-l2", "10-planner-architect-coder.md#47-agent-led-environment-setup-l4", "10-planner-architect-coder.md#84-coder-2-e04"]
built_by = ["2-E04-T01", "2-E04-T02", "2-E04-T05", "2-E04-T06", "2-E04-T07", "2-E04-T09", "2-E04-T10", "2-E04-T11"]

