# Area control of stage 0. Rules: docs/plan/README.md. Check: python3 tools/plan/plan.py check
# Detailed design: docs/design/01-data-model.md, docs/design/02-control-plane.md
stage = "0"

[[epic]]
id = "0-E02"
title = "Data model and migrations"
goal = "Postgres schema of all core tables of stage 0 with tenant separation via row-level security, partitioning and retention; migrator forward-only (expand/contract) with a lock against parallel runs, backup gate and halt points; schema version and pgvector minimum version checked at start"
sources = ["08 section 4 stage 0 point 1", "06 section 5"]
depends_on = ["0-E01"]

[[epic]]
id = "0-E04"
title = "Ingress, inbox, dedupe and router"
goal = "Intake of normalized events with inbox and dedupe; the router assigns events to services and pipelines"
sources = ["01 section 2, 3", "03 section 1"]
depends_on = ["0-E02"]

[[epic]]
id = "0-E05"
title = "Orchestrator and run state machine"
goal = "Run state machine as a table of state times event with mandatory events, object lock, steps, pg-boss"
sources = ["03 section 2", "ADR-67, ADR-68"]
depends_on = ["0-E02"]   # 0-E04 only for the tasks that need ingress or router (T03, T05, T10); catalog 2026-11-01

[[epic]]
id = "0-E06"
title = "Config resolver and policy"
goal = "Configuration by hierarchy with base SHA and schema, fail closed; policy deny by default, command covers effect"
sources = ["04", "05 section 2", "ADR-65"]
depends_on = ["0-E02"]

[[epic]]
id = "0-E07"
title = "Limit ledger"
goal = "Buckets, reservation, consumption, abort on overrun (S3)"
sources = ["04 section 6", "ADR-27"]
depends_on = ["0-E02"]

