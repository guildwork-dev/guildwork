id = "cli-install"
title = "Command guildwork install with air gap branch"
kind = "role"
path = "apps/cli/src/commands/install.ts"
package = "@guildwork/cli"
stage = "0"
purpose = "Command guildwork install: preflight without writing, bundle and signature check, only add to the target folder, pull by digest, migrate, start, one-time code of the emergency admin only on stdout, doctor; with an air gap branch and the test environment tools/airgap-env. Not upgrade (cli) and not the checks themselves (cli-doctor)."
design = ["06-installation-operations-ui.md#241-guildwork-install", "06-installation-operations-ui.md#41-installation", "06-installation-operations-ui.md#29-telemetry-update-notice-air-gap", "06-installation-operations-ui.md#23-compose-bundle-single-host"]
built_by = ["0-E18-T06", "0-E18-T17"]

[[provides]]
name = "cmd-install"
kind = "cli"
title = "guildwork install with all options from section 2.4.1 and step IDs install.preflight.*, install.bundle.*, install.write, install.images, install.migrate, install.start, install.break-glass, install.doctor, install.next"
defined_in = "06-installation-operations-ui.md#241-guildwork-install"
from_task = "0-E18-T06"

[[provides]]
name = "zielordner"
kind = "file"
title = "Target folder of the installation: compose.yaml, profiles/, .env 0600, secrets/ 0700 (master.key, store/ with initial secrets), postgres-secrets/, worker-secrets/pool-key, installation.yaml, release.json and release.prev.json; a second run only adds; plus the Z1 files egress.yaml (allow_private with the host from public_url), worker.yaml and socket-proxy/policy.json, regenerated per run from installation.yaml (03 FE-328, FE-658)"
defined_in = "06-installation-operations-ui.md#23-compose-bundle-single-host"
from_task = "0-E18-T06"

[[provides]]
name = "install-air-gap"
kind = "cli"
title = "guildwork install --air-gap --registry-mirror <host> --bundle <file>: images onto the mirror with the same digest, harness source operator_mirror, telemetry forced off"
defined_in = "06-installation-operations-ui.md#29-telemetry-update-notice-air-gap"
from_task = "0-E18-T17"

[[provides]]
name = "airgap-env"
kind = "cli"
title = "tools/airgap-env: Docker network without egress, mirror registry, fixture server as SCM, fake LLM, counting at the egress proxy (S8 case)"
defined_in = "06-installation-operations-ui.md#213-portability-test-and-s8"
from_task = "0-E18-T17"

