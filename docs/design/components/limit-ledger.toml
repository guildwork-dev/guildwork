id = "limit-ledger"
title = "Limit ledger: buckets, reservation, consumption, settlement, time windows"
kind = "role"
path = "apps/control-plane/src/ledger/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Hard limit for costs, runs, tokens and parallelism: key chain and buckets from the snapshot, atomic reservation across all keys before the run, booking of cumulative usage during the run with abort, settlement and release afterwards. Does not start or end runs itself; it reports budget_exhausted to the orchestrator."
design = [
  "02-control-plane.md#48-limit-ledger",
  "02-control-plane.md#22-public-interfaces",
]
built_by = [
  "0-E07-T01",
  "0-E07-T02",
  "0-E07-T03",
  "0-E07-T04",
  "0-E07-T05",
  "0-E07-T06",
  "8-E06-T01",
  "10-E05-T01",
]

[[provides]]
name = "schluesselkette"
kind = "ts-api"
title = "keyChain(snapshot, KeyChainInput), ensureBuckets, BucketKey, BucketKeyKind (FE-260); from 10-E05-T01 key campaign (FE-266)"
defined_in = "02-control-plane.md#22-public-interfaces"
from_task = "0-E07-T01"

[[provides]]
name = "reserve"
kind = "ts-api"
title = "createLedger, Ledger.reserve(ReservationRequest): ReservationResult, Ledger.status: BucketStatus[] (FE-261); from 8-E06-T01 estimate from PriceLookup (FE-266)"
defined_in = "02-control-plane.md#22-public-interfaces"
from_task = "0-E07-T02"

[[provides]]
name = "usage"
kind = "ts-api"
title = "Ledger.recordUsage(UsageReport): cumulative per lease, response cancel when exceeded, CostSource (FE-262)"
defined_in = "02-control-plane.md#22-public-interfaces"
from_task = "0-E07-T03"

[[provides]]
name = "settle"
kind = "ts-api"
title = "Ledger.settle and Ledger.release: settlement with runs.cost_usd, release on cancelled, expired, failed, paused_budget"
defined_in = "02-control-plane.md#22-public-interfaces"
from_task = "0-E07-T04"

[[provides]]
name = "ledger-queues"
kind = "queue"
title = "Queues ledger-settle (payload { tenantId, reservationId }) and ledger-expire (sweeper every 5 minutes)"
defined_in = "02-control-plane.md#3-data"
from_task = "0-E07-T04"

[[provides]]
name = "konfig-ledger"
kind = "config"
title = "ledger.estimate.tokens_per_turn, ledger.reservation_ttl_factor; evaluation of limits.* according to the table in 4.8"
defined_in = "02-control-plane.md#48-limit-ledger"
from_task = "0-E07-T02"

[[provides]]
name = "metriken"
kind = "metric"
title = "guildwork.ledger.rejected, guildwork.ledger.cancel, guildwork.ledger.fill_ratio, guildwork.run.cost, guildwork.run.tokens"
defined_in = "02-control-plane.md#51-metrics-of-this-area"
from_task = "0-E07-T04"

