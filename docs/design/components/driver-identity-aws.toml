id = "driver-identity-aws"
title = "CloudIdentity aws"
kind = "driver"
path = "drivers/identity-aws/"
package = "@guildwork/driver-identity-aws"
stage = "8"
purpose = "Driver of the CloudIdentity contract for AWS: assume the role of the items via STS (aws_sts, result as JSON per FE-1325), ambient or via web identity with the JWT of the own issuer (FE-1340). Creates no IAM roles (OpenTofu module aws or operator)."
design = [
  "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp",
  "13-stage-8-providers-and-bases.md#84-bases-8-e04",
]
built_by = ["8-E04-T03"]

[[provides]]
name = "cloudidentity"
kind = "contract"
title = "CloudIdentity aws: ambientToken(aud), exchange aws_sts with { accessKeyId, secretAccessKey, sessionToken } and anthropic_wif only with web identity token; ttlS clamped to maxTtlS; contract attestation"
defined_in = "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp"
from_task = "8-E04-T03"

[[provides]]
name = "konfig"
kind = "config"
title = "cloud_identity[] with driver aws: AwsIdentityConfig (region, source, itemRoleArn, sessionPolicy, maxTtlS)"
defined_in = "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp"
from_task = "8-E04-T03"

