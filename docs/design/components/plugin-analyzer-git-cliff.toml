title = "Analyzer git-cliff for release notes"
kind = "plugin"
path = "plugins/analyzer-git-cliff/"
package = "@guildwork/plugin-analyzer-git-cliff"
stage = "10"
purpose = "Returns version, tag, date, commits and breaking list deterministically from Conventional Commits as a properties bag for the mode release of the docs service. Produces no findings and no prose; version and date never come from a model."
