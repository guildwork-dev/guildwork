id = "credential-broker"
title = "Credential broker: secrets, OIDC issuer, item token, SCM tokens, LLM grants, pool keys, profiles"
kind = "role"
path = "apps/control-plane/src/broker/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Issues short-lived, narrowly scoped credentials: secrets from the SecretStore with audit, SCM tokens per effect or per clone with exactly one repo and profile, item tokens, LLM grants per item and pool keys; publishes the JWKS of its own issuer. Never stores a token and never sees a subscription token; the key ring itself lives in the driver identity-self-issuer."
design = [
  "04-effects-audit-credentials.md#23-credential-broker",
  "04-effects-audit-credentials.md#231-interface",
  "04-effects-audit-credentials.md#232-secrets",
  "04-effects-audit-credentials.md#233-own-oidc-issuer-and-key-ring",
  "04-effects-audit-credentials.md#234-item-token",
  "04-effects-audit-credentials.md#235-scm-tokens-per-effect-and-per-item",
  "04-effects-audit-credentials.md#236-llm-grants-and-pool-keys",
  "04-effects-audit-credentials.md#44-key-rotation",
  "04-effects-audit-credentials.md#25-metrics",
  "04-effects-audit-credentials.md#7-configuration",
]
