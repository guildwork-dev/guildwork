id = "plugin-kb-zoekt"
title = "KnowledgeStore Zoekt"
kind = "plugin"
path = "plugins/kb-zoekt/"
package = "@guildwork/plugin-kb-zoekt"
stage = "9"
purpose = "Additional lexical search leg across many repos (trigram and regex) as a KnowledgeStore with search only; the worker builds the shards, the service zoekt has neither a token nor an outbound network. Not: replacement for pg-kb, own clone with token (FE-1441)."
design = [
  "14-stage-9-breadth-and-hardening.md#272-zoekt-as-a-knowledgestore",
  "14-stage-9-breadth-and-hardening.md#5-failure-and-abort-paths",
  "14-stage-9-breadth-and-hardening.md#87-sarif-zoekt-k1-confluence-9-e07",
]
built_by = ["9-E07-T02"]

[[provides]]
name = "knowledge-store"
kind = "contract"
title = "KnowledgeStore Zoekt with LEXICAL_MULTI_REPO, FTS and CROSS_REPO; query.search and applyIncrement (layer zoekt), remaining methods unsupported (ZoektConfig, ZoektSearchRequest)"
defined_in = "14-stage-9-breadth-and-hardening.md#272-zoekt-as-a-knowledgestore"
from_task = "9-E07-T02"

[[provides]]
name = "indexer-schicht-zoekt"
kind = "ts-api"
title = "Indexer layer zoekt (services/indexer/src/zoekt/): work item indexer.zoekt (ZoektIndexJobInput, ZoektIndexJobOutput) in the worker, stored via applyIncrement in the index volume with meta.json"
defined_in = "14-stage-9-breadth-and-hardening.md#272-zoekt-as-a-knowledgestore"
from_task = "9-E07-T02"

[[provides]]
name = "konfig-zoekt"
kind = "config"
title = "services.<id>.knowledge.zoekt (x-qualification), plugins.knowledge as a list with entry kb-zoekt (FE-1451), Helm switch zoekt.enabled and Compose profile zoekt (deploy/compose/profiles/zoekt.yaml)"
defined_in = "14-stage-9-breadth-and-hardening.md#7-configuration"
from_task = "9-E07-T02"

[[provides]]
name = "kb-zoekt-errors-total"
kind = "metric"
title = "guildwork.kb.zoekt_errors with stage (build, search): failures of the service zoekt, search degrades to pg-kb"
defined_in = "14-stage-9-breadth-and-hardening.md#51-metrics-of-this-area"
from_task = "9-E07-T02"

