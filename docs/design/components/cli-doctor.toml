id = "cli-doctor"
title = "Command guildwork doctor with all checks"
kind = "role"
path = "apps/cli/src/doctor/"
package = "@guildwork/cli"
stage = "0"
purpose = "Command guildwork doctor: framework with check registry, the installation checks D01 to D34 and the per-repo checks R01 to R04 (FE-642); only checks and writes nothing except probe objects, which it deletes, and the report. It calls the check functions of other areas (separation, audit anchor, blueprint, agent_ci) but does not build them."
