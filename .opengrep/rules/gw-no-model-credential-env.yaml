#
# No code reads model credentials from its own environment (12 section 5.2,
# ADR-57). The worker sets ANTHROPIC_* and CLAUDE_* only as keys of the
# environment object of the child process; reading or setting them on the
# process environment is reported everywhere, tests included. Covered: dot
# access, bracket access with a literal, any destructuring (defaults, renaming,
# nesting, assignment), through process, globalThis.process, process["env"],
# require("node:process"), an import of node:process, env taken out of
# process, `in process.env`, `process.env!`, and the same read forms through an
# alias (variable, parameter default, parameter typed NodeJS.ProcessEnv, env
# renamed out of process or imported under another name). Writing into a
# parameter typed NodeJS.ProcessEnv and delete stay allowed: they build the child
# environment. Not covered: see docs/quality/toolchain.md, "Opengrep rule tests". Tests: .opengrep/tests/gw-no-model-credential-env/
# (make opengrep).
rules:
  - id: gw-no-model-credential-env
    languages: [typescript]
    severity: ERROR
    message: >-
      ANTHROPIC_* and CLAUDE_* are never read from the process environment
      (ADR-57). The worker reads the token from its host file and sets it only in
      the environment object of the child process.
    patterns:
      - pattern-either:
          # $E is the process environment written out.
          - patterns:
              - pattern-either:
                  - pattern: $E.$NAME
                  - pattern: $E?.$NAME
                  - pattern: $E["$NAME"]
                  - pattern: $E?.["$NAME"]
                  - pattern: $E[`$NAME`]
                  - pattern: $NAME = $E
                  - pattern: var $NAME = $E
              - metavariable-regex:
                  metavariable: $E
                  regex: ^(process|globalThis\.process|globalThis\[["'`]process["'`]\]|require\(["'`](node:)?process["'`]\))(\??\.env|\??\.?\[["'`]env["'`]\])$
          # Destructuring env out of the process object.
          - patterns:
              - pattern-either:
                  - pattern: $NAME = $E
                  - pattern: var $NAME = $E
              - metavariable-regex:
                  metavariable: $E
                  regex: ^(process|globalThis\.process|globalThis\[["'`]process["'`]\]|require\(["'`](node:)?process["'`]\))$
          # env taken out of process or imported from the process module.
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              import {..., env, ...} from "$MOD";
                              ...
                          - pattern-inside: |
                              var {..., env, ...} = require("$MOD");
                              ...
                      - metavariable-regex:
                          metavariable: $MOD
                          regex: ^(node:)?process$
                  - pattern-inside: |
                      var {..., env, ...} = process;
                      ...
              - pattern-either:
                  - pattern: env.$NAME
                  - pattern: env?.$NAME
                  - pattern: env["$NAME"]
                  - pattern: $NAME = env
                  - pattern: var $NAME = env
          # A namespace, default or require import of the process module.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import * as $P from "$MOD";
                      ...
                  - pattern-inside: |
                      import $P from "$MOD";
                      ...
                  - pattern-inside: |
                      var $P = require("$MOD");
                      ...
              - metavariable-regex:
                  metavariable: $MOD
                  regex: ^(node:)?process$
              - pattern-either:
                  - pattern: $P.env.$NAME
                  - pattern: $P.env?.$NAME
                  - pattern: $P.env["$NAME"]
                  - pattern: $NAME = $P.env
                  - pattern: var $NAME = $P.env
                  - pattern: $NAME = $P
                  - pattern: var $NAME = $P
          # A parameter typed NodeJS.ProcessEnv: reads only. Writing into such an
          # object and delete build the child environment (ADR-57).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      function $F(..., $E: NodeJS.ProcessEnv, ...) { ... }
                  - pattern-inside: |
                      (..., $E: NodeJS.ProcessEnv, ...) => $BODY
              - pattern-either:
                  - pattern: $E.$NAME
                  - pattern: $E?.$NAME
                  - pattern: $E["$NAME"]
                  - pattern: $E!.$NAME
                  - pattern: |
                      "$NAME" in $E
                  - pattern: $NAME = $E
                  - pattern: var $NAME = $E
              - pattern-not-inside: $E.$X = $V
              - pattern-not-inside: $E[$X] = $V
              - pattern-not-inside: delete $E.$X
              - pattern-not-inside: delete $E[$X]
          # Other aliases of the process environment: a parameter default, a
          # variable, env renamed out of process, env imported under another name
          # or assigned to a variable.
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      function $F(..., $E = process.env, ...) { ... }
                  - pattern-inside: |
                      (..., $E = process.env, ...) => $BODY
                  - pattern-inside: |
                      $E = process.env;
                      ...
                  - pattern-inside: |
                      var $E = process.env;
                      ...
                  - pattern-inside: |
                      var {..., env: $E, ...} = process;
                      ...
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              import {..., env as $E, ...} from "$MOD";
                              ...
                          - pattern-inside: |
                              import {..., env, ...} from "$MOD";
                              ...
                              var $E = env;
                              ...
                      - metavariable-regex:
                          metavariable: $MOD
                          regex: ^(node:)?process$
              - pattern-either:
                  - pattern: $E.$NAME
                  - pattern: $E?.$NAME
                  - pattern: $E["$NAME"]
                  - pattern: $E!.$NAME
                  - pattern: |
                      "$NAME" in $E
                  - pattern: $NAME = $E
                  - pattern: var $NAME = $E
          # A presence check and a non-null assertion.
          - pattern: |
              "$NAME" in process.env
          - pattern: process.env!.$NAME
      # A member name, or the text of a destructuring pattern that names one.
      - metavariable-regex:
          metavariable: $NAME
          regex: (?s)^(\{.*\b)?(ANTHROPIC|CLAUDE)_
