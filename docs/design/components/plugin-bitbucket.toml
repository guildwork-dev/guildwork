id = "plugin-bitbucket"
title = "Bitbucket Cloud"
kind = "plugin"
path = "plugins/bitbucket/"
package = "@guildwork/plugin-bitbucket"
stage = "9"
purpose = "Bitbucket Cloud as a code hoster with HMAC webhook, SCMProvider with single inline comments, Code Insights for status and annotations, and labels as comment markers. Not: WorkItemProvider (01 matrix 11.1 dropped), merge."
design = [
  "14-stage-9-breadth-and-hardening.md#211-common-host-framework",
  "14-stage-9-breadth-and-hardening.md#215-bitbucket-cloud",
  "14-stage-9-breadth-and-hardening.md#218-spike-and-test-accounts",
  "14-stage-9-breadth-and-hardening.md#41-host-inbound-with-signature-tier",
  "14-stage-9-breadth-and-hardening.md#42-review-output-via-the-fallback-chain",
  "14-stage-9-breadth-and-hardening.md#81-code-hosts-9-e01",
]
built_by = ["9-E01-T02", "9-E01-T07"]

