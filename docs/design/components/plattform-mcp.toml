id = "plattform-mcp"
title = "Platform MCP with item token, read tools, propose_* and kb.*"
kind = "role"
path = "apps/control-plane/src/mcp/"
package = "@guildwork/control-plane"
stage = "0"
area = "03"
purpose = "MCP server of the control plane through which a harness in the sandbox reads fresh context with its item token and submits write requests; every call is checked against token, lease and service manifest. Applies no effect itself (that is done by the Effect Gateway) and calls no model."
