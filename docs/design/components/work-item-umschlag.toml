id = "work-item-umschlag"
title = "Work item envelope, result, grants and write request schemas"
kind = "package"
path = "packages/contracts/src/work/"
package = "@guildwork/contracts"
stage = "0"
area = "03"
purpose = "Versioned TypeBox schemas including types for everything that travels between control plane and worker: envelope, grants, result, error and Work API messages. The write request schemas (ProposalV1) are offered by the Effect Gateway (FE-345). No logic, no storage location and no check of rights; the envelope never carries a secret."
