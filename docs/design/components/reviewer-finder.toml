id = "reviewer-finder"
title = "Finder passes bugs_diff, bugs_introduced, security, standards, ticket, plan_conformance"
kind = "service"
path = "services/reviewer/src/jobs/find.handler.ts"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Runs per finder and shard a work item reviewer.find with AgentRuntime, read-only tools and schema output, and delivers candidates, never findings or effects (FE-801). Checking and filtering the candidates belongs to the verifier and the findings component."
design = [
  "08-reviewer.md#47-finder-passes",
  "08-reviewer.md#48-security-finder",
  "08-reviewer.md#36-severities-and-categories",
  "08-reviewer.md#33-output-schemas-of-the-models",
  "10-planner-architect-coder.md#43-architect",
]
built_by = ["1-E03-T01", "1-E03-T02", "1-E03-T03", "1-E03-T04", "2-E03-T08"]

[[provides]]
name = "reviewer.find"
kind = "queue"
title = "Handler of the work item reviewer.find: FindInput to FindOutput with FinderOutputSchema, second attempt on schema_invalid"
defined_in = "08-reviewer.md#25-steps-and-work-item-envelopes"
from_task = "1-E03-T01"

[[provides]]
name = "metrik-finder-fehler"
kind = "metric"
title = "reviewer_finder_failures_total{finder,code}"
defined_in = "08-reviewer.md#5-failure-and-abort-paths"
from_task = "1-E03-T01"

[[provides]]
name = "prompt-finder-bugs"
kind = "prompt"
title = "finder.bugs_diff.md and finder.bugs_introduced.md"
defined_in = "08-reviewer.md#47-finder-passes"
from_task = "1-E03-T02"

[[provides]]
name = "prompt-finder-standards-ticket"
kind = "prompt"
title = "finder.standards.md (rule_id, verbatim rule_quote) and finder.ticket.md (ticket_gap)"
defined_in = "08-reviewer.md#47-finder-passes"
from_task = "1-E03-T03"

[[provides]]
name = "prompt-finder-security"
kind = "prompt"
title = "finder.security.md with focus, exclusion list (FE-842), cwe, reachability, exploitability"
defined_in = "08-reviewer.md#48-security-finder"
from_task = "1-E03-T04"

[[provides]]
name = "finder-plan-conformance"
kind = "ts-api"
title = "Finder plan_conformance: single call with @guildwork/method-check/conformance, approved plan and design version via ControllerHost.approvedDesignInputs, findings plan_deviation"
defined_in = "10-planner-architect-coder.md#43-architect"
from_task = "2-E03-T08"

