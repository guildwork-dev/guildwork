#
# CodeQL code scanning of the TypeScript, the workflows and the Python tools
# with the suite security-extended (architecture 12 section 5.2). Only in the
# public repository: CodeQL is free there, so the job is skipped elsewhere
# (rule public-only-guard of quality/ci/policy.toml). Scheduled runs carry no
# event payload and so no repository object; for them the repository
# variable GUILDWORK_VISIBILITY decides.
#
# Actions are pinned to the commit of a release tag, read from the GitHub API
# of the vendor on 2026-11-01 (GET repos/<owner>/<repo>/git/ref/tags/<tag>,
# an annotated tag followed to its commit with GET git/tags/<sha>):
#   actions/checkout     v7.0.1   3d3c42e5aac5ba805825da76410c181273ba90b1
#   github/codeql-action v4.39.1  9b3254085494b55a0f7c4c2b3d2d52cc712ce370

name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.GUILDWORK_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      security-events: write # upload the results to code scanning
      actions: read # read the workflow run, needed by the action in private repositories
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
