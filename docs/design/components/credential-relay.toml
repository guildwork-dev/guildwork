id = "credential-relay"
title = "Credential relay in the egress proxy (API key, WIF, SigV4)"
kind = "role"
path = "apps/egress-proxy/src/relay/"
package = "@guildwork/egress-proxy"
stage = "0"
area = "03"
purpose = "Holds the LLM credential of an item only in the memory of the egress proxy (Z1), accepts from the sandbox only model calls with the placeholder, checks them against the rules R1 to R10, sets the real header or the SigV4 signature and counts the usage. Does not book into the ledger itself and does not apply to the start path subscription."
design = [
  "03-execution.md#210-credential-relay",
  "03-execution.md#46-relay-call",
  "03-execution.md#291-control-api-for-the-worker",
  "13-stage-8-providers-and-bases.md#223-exchange-in-the-worker-for-wif",
  "13-stage-8-providers-and-bases.md#224-credential-relay-for-further-upstreams",
]
built_by = ["0-E12-T05", "0-E15-T08", "8-E02-T03", "8-E02-T04", "8-E02-T05", "8-E02-T06", "8-E03-T03"]

