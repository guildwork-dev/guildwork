kind = "ui"
path = "apps/admin-ui/src/pages/RunRecord.tsx"
package = "@guildwork/admin-ui"
stage = "1"
purpose = "Read model RunRecordView from the tables of the control plane with redaction, endpoints for list, single view and export as well as the pages Runs and Run Record with deep link for status comments; writes nothing and does not compute the provenance marker itself (that is delivered by 2-E01-T12 from area 10)."
