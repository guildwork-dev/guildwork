id = "egress-proxy"
title = "Egress proxy: CONNECT with allowlist per item, control API, air gap, policy per phase"
kind = "program"
path = "apps/egress-proxy/"
package = "@guildwork/egress-proxy"
stage = "0"
area = "03"
purpose = "Sole way of a sandbox to the outside: CONNECT only to exactly allowed hosts per item, binding to the item via the network interface, DNS only in the proxy, air gap as intersection, connection log per item; controlled by the worker via a control API. No TLS interception except in the inspection proxy, no database connection."
design = [
  "03-execution.md#29-egress-proxy",
  "03-execution.md#291-control-api-for-the-worker",
  "03-execution.md#292-forwarding-and-binding",
  "03-execution.md#293-dns-without-a-back-channel-adr-64",
  "03-execution.md#7-configuration",
  "10-planner-architect-coder.md#25-sandbox-phases-enforced-egress-proxy-no-dns",
]
built_by = ["0-E12-T04", "2-E01-T07", "8-E04-T11", "10-E04-T02"]

