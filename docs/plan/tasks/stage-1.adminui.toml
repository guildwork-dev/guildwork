[[task]]
id = "1-E08-T04"
title = "Kill switch: table, API and effect"
description = """Kill switch per detailed design 06 section 2.16 (FE-625): table kill_switches (migration 0102 with the columns from detailed design 06 section 3.1, 01 section 3.1a), scopes global, org, repo, service, service_repo; POST /admin/api/v1/kill-switches (approver, admin), DELETE (admin only), GET. Effect: triggering sends stop to all active runs in the scope (actor killswitch:<id>) and revokes their leases (next heartbeat cancel); while active, the router ends new events with Skipped(kill_switch) and a visible reply, and the work API grants no lease for items in the scope; lifting resumes nothing. Audit per action and mandatory notification via the notifier."""
design = ["06-installation-operations-ui.md#216-run-record-costs-and-kill-switch-stage-1", "06-installation-operations-ui.md#46-states"]
result = "apps/control-plane/src/killswitch/, apps/control-plane/src/admin/api/kill-switches.ts, changes in the router and the work API claim"
