id = "kampagnen"
title = "Campaigns across many repos with ledger key, abort rule and UI"
kind = "role"
path = "apps/control-plane/src/campaigns/"
package = "@guildwork/control-plane"
stage = "10"
purpose = "One change by recipe across many repos: parent run with plan and G1, per repo a normal pipeline run campaign-child with all gates, a shared budget in the ledger key campaign, abort on failure rate, admin API and admin UI. No auto-merge, no Coder child runs from stage 9 (FE-1236) and no replacement for the limits of the repos."
