# Area reviewer of stage 1. Rules: docs/plan/README.md. Check: python3 tools/plan/plan.py check
# Detailed design: docs/design/08-reviewer.md
stage = "1"

[[epic]]
id = "1-E01"
title = "Reviewer service skeleton"
goal = "Service package `services/reviewer` with manifest, schemas, controller and step plan as a single-service run, state per PR, inputs from PR events, `@agent review [full]` and `@agent ignore`, prompt storage with `prompt_v` and profile contribution to the qualification profile"
sources = ["02 sections 0, 4", "03 section 1"]
depends_on = ["0-E16"]

[[epic]]
id = "1-E02"
title = "Gate and context"
goal = "Deterministic gate (skipping, size, file filters, auto-pause), reservation with budget split, prepare job with context tool in the sandbox (diff, neighborhood, callers, guidelines from the base SHA), gate model, router and context package with token budget"
sources = ["02 section 4", "10 section 3"]
depends_on = ["1-E01"]

[[epic]]
id = "1-E03"
title = "Finder and verifier"
goal = "Finder passes `bugs_diff`, `bugs_introduced`, `security`, `standards`, `ticket` with schema output, evidence check, verifier `read` and build verifier with effective mode (profile `operator_test` or `verifier.build`)"
sources = ["02 section 4", "07 section 3.8"]
depends_on = ["1-E02"]

[[epic]]
id = "1-E04"
title = "Findings, fingerprints and increment"
goal = "Findings in the DB with fingerprint v1, code filter, dedupe, noise filter, feedback harvesting, incremental review with Addressed and Outdated, artifact and library `reviewChange`"
sources = ["02 section 4", "08 stage 1"]
depends_on = ["1-E03"]

[[epic]]
id = "1-E05"
title = "Output on GitHub"
goal = "Inline review comments for P0 and P1, summary, check run `ai-review` without silent green, thread resolution, status line and shadow mode, all via the Effect Gateway; plus the executors review, thread_resolve, reply and notify so that the reviewer can post live"
sources = ["02 section 4", "03 section 2.3"]
depends_on = ["1-E04"]

[[epic]]
id = "1-E06"
title = "Analyzers in ingest mode"
goal = "SARIF 2.1.0 from CI artifacts (optionally code scanning) as a candidate signal for finder and verifier, with allowlist, size limits and `llmUse`"
sources = ["01 section 12", "ADR-40"]
depends_on = ["1-E04"]

[[epic]]
id = "1-E09"
title = "Eval and qualification of the reviewer"
goal = "Adapter, R1 with human labels, R2, R4, R5, bare harness; Gate A green, Gate B measured and reported, ReviewBench reference value read beforehand, qualification row as reference qualification"
sources = ["07 section 3.1", "10 section 3"]
depends_on = ["0-E20", "1-E05"]

[[epic]]
id = "1-E10"
title = "Suites, permissions test and acceptance stage 1"
goal = "S1, S2, S4, S6, S8 green including the cases of the personal operator mode; permissions test against real app permissions; `shadow` on own repos, `live` after qualification; release and stage report with all done criteria from 08 stage 1"
sources = ["08 stage 1"]
depends_on = ["1-E05", "1-E06", "1-E07", "1-E08", "1-E09", "0-E18", "0-E21"]

