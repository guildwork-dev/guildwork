id = "reviewer-verifier"
title = "Evidence check, verifier read, recheck and build"
kind = "service"
path = "services/reviewer/src/jobs/verify.handler.ts"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Checks candidates deterministically for evidence (prefilter in the controller) and has them confirmed in the work item reviewer.verify in the modes read, recheck or build; sets the effective verifier mode before the claim (FE-835). May only lower severity (FE-810) and creates no findings in the DB."
design = [
  "08-reviewer.md#49-verifier",
  "08-reviewer.md#29-building-blocks-of-the-controller",
  "08-reviewer.md#33-output-schemas-of-the-models",
]
built_by = ["1-E03-T05", "1-E03-T06", "1-E03-T07", "1-E04-T05"]

