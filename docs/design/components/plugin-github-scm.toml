]

[[provides]]
name = "scm-lesend"
kind = "contract"
title = "SCMProvider github reading: getFile, compare (with hunks), getPermission, codeowners, getChange (repo and number suffice), listChangedFiles, getThreads, mergeStatus (with unknown), checkEvidence, repoInfo (with topics and custom properties), installedRepos, ciFailureLogs (untrusted), rateLimitState (FE-555)"
defined_in = "05-plugins-and-contracts.md#2146-scm-methods-mapped-to-github"
from_task = "0-E14-T07"

[[provides]]
name = "scm-schreibend"
kind = "contract"
title = "SCMProvider github writing: upsertSummary, submitReview with fallback chain and idempotency, reply, resolveThread, renderSuggestion, startCheck, updateCheck, openChange (draft, marker), updateChange, requestReview, setLabels"
defined_in = "05-plugins-and-contracts.md#2146-scm-methods-mapped-to-github"
from_task = "0-E14-T08"

[[provides]]
name = "push"
kind = "contract"
title = "SCMProvider.push via Git bundle without force with expectedOldSha, only agent/* or the anchor branch with profile audit_anchor, idempotent when the target is already reached (FE-516)"
defined_in = "05-plugins-and-contracts.md#2147-push-via-git-bundle-without-force-ruling-fe-516"
from_task = "0-E14-T09"

[[provides]]
name = "ci-artifact"
kind = "contract"
title = "SCMProvider.ciArtifact: artifact of a completed workflow run at the SHA as bytes (profile read)"
defined_in = "05-plugins-and-contracts.md#2113-scmprovider"
from_task = "1-E06-T02"

[[provides]]
name = "code-scanning-sarif"
kind = "contract"
title = "SCMProvider.codeScanningSarif with capability CODE_SCANNING_READ (or visibly off if the app permission is missing)"
