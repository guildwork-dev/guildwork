id = "plugin-github-scm"
title = "GitHub SCMProvider: read, write, push, merge, rerun, approve, check actions, SARIF"
kind = "plugin"
path = "plugins/github/src/scm/"
package = "@guildwork/plugin-github"
stage = "0"
purpose = "Maps the SCMProvider contract to the GitHub API: read methods for control plane, platform MCP and services, write methods only for the Effect Gateway with a token per effect, push via Git bundle without force, and the optional methods of the later stages. Decides nothing itself: policy, push check and retry lie with the caller; plugin-github mints the token."
design = [
  "05-plugins-and-contracts.md#2146-scm-methods-mapped-to-github",
  "05-plugins-and-contracts.md#2147-push-via-git-bundle-without-force-ruling-fe-516",
  "05-plugins-and-contracts.md#44-fallback-chain-of-submitreview-on-github",
  "05-plugins-and-contracts.md#2113-scmprovider",
]
built_by = [
  "0-E14-T07",
  "0-E14-T08",
  "0-E14-T09",
  "1-E06-T02",
  "1-E06-T03",
  "2-E06-T01",
  "2-E06-T02",
  "2-E06-T04",
  "2-E06-T05",
  "4-E02-T04",
  "4-E04-T01",
  "5-E01-T02",
  "5-E02-T01",
  "5-E02-T06",
  "5-E03-T03",
  "6-E04-T04",
  "6-E06-T01",
