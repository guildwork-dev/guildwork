id = "plugin-analyzer-axe"
title = "Analyzer axe-core"
kind = "plugin"
path = "plugins/analyzer-axe/"
package = "@guildwork/plugin-analyzer-axe"
stage = "10"
purpose = "Checks the accessibility of the app started in the QA E2E item with axe-core and returns SARIF with a pseudo path per route; plus the QA step e2e_a11y. Never blocks in stage 10: findings are hints, the QA verdict stays unchanged (FE-1526)."
design = [
  "15-stage-10-edge-layers.md#261-analyzer-axe",
  "15-stage-10-edge-layers.md#263-shared-rules-of-the-three-new-analyzers",
  "15-stage-10-edge-layers.md#264-an1",
  "15-stage-10-edge-layers.md#84-analyzers-10-e04",
]
built_by = ["10-E04-T01", "10-E04-T03"]

[[provides]]
name = "analyzer"
kind = "contract"
title = "Analyzer contract v1alpha1: manifestExt, describe, run with AxeConfig, SARIF with ruleId, pseudo path @route:<path> and fingerprint"
defined_in = "15-stage-10-edge-layers.md#261-analyzer-axe"
from_task = "10-E04-T01"

[[provides]]
name = "beutel-a11y"
kind = "ts-api"
title = "properties bag guildwork/a11y@1 { route, selector, impact, helpUrl } in packages/sarif/src/bags/a11y.ts"
defined_in = "15-stage-10-edge-layers.md#261-analyzer-axe"
from_task = "10-E04-T01"

[[provides]]
name = "konfig"
kind = "config"
title = "AxeConfig, services.qa.e2e.a11y { enabled, max_routes, baseline, tags } and analyzer instance analyzers[axe]"
defined_in = "15-stage-10-edge-layers.md#7-configuration"
from_task = "10-E04-T01"

[[provides]]
name = "qa-step-e2e-a11y"
kind = "contract"
title = "QA E2E step e2e_a11y after e2e_generate, findings source analyzer:axe as flag (K13)"
defined_in = "15-stage-10-edge-layers.md#261-analyzer-axe"
from_task = "10-E04-T01"

[[provides]]
name = "an1-fixtures"
kind = "file"
title = "20 fixture repos with a static app under packages/testkit/src/contract/fixtures/analyzer-an1/axe/"
defined_in = "15-stage-10-edge-layers.md#264-an1"
from_task = "10-E04-T03"

