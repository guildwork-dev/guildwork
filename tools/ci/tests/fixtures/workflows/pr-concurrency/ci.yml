#
# Violation of pr-concurrency only: a pull request workflow without
# cancel-in-progress.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
