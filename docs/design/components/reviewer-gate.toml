id = "reviewer-gate"
title = "Deterministic gate G1 to G9 and prepare job with gate model"
kind = "service"
path = "services/reviewer/src/controller/gate-rules.ts"
package = "@guildwork/service-reviewer"
stage = "1"
purpose = "Decides deterministically whether a reviewer run takes place (rules G1 to G9), and builds the PrepareOutput in the prepare job with the context tool and the gate model. The gate model never decides on skipping (FE-803)."
design = [
  "08-reviewer.md#44-gate",
  "08-reviewer.md#25-steps-and-work-item-envelopes",
  "08-reviewer.md#29-building-blocks-of-the-controller",
]
built_by = ["1-E02-T01", "1-E02-T07"]

[[provides]]
name = "gate-regeln"
kind = "ts-api"
title = "evaluateGate(GateInput): GateDecision for G1 to G8, BUILTIN_GENERATED_GLOBS, gateCheckOutcome(decision); G9 as the result of the reservation"
defined_in = "08-reviewer.md#29-building-blocks-of-the-controller"
from_task = "1-E02-T01"

[[provides]]
name = "metrik-skipped"
kind = "metric"
title = "reviewer_skipped_total{reason}"
defined_in = "08-reviewer.md#44-gate"
from_task = "1-E02-T01"

[[provides]]
name = "reviewer.prepare"
kind = "queue"
title = "Handler of the work item reviewer.prepare: PrepareInput to PrepareOutput in the sandbox"
defined_in = "08-reviewer.md#25-steps-and-work-item-envelopes"
from_task = "1-E02-T07"

[[provides]]
name = "prompt-gate"
kind = "prompt"
title = "gate.md for models.gate with GateModelOutputSchema"
defined_in = "08-reviewer.md#44-gate"
from_task = "1-E02-T07"

[[uses]]
interface = "service-reviewer/schemas"
from_task = "1-E02-T01"
