id = "treiber-lader"
title = "Load drivers, capabilities by probe, health"
kind = "role"
path = "apps/control-plane/src/drivers/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Loads from installation.yaml exactly one BlobStore, one SecretStore and the list CloudIdentity, only with a passed contract suite, determines the capabilities by probe and polls health() every 60 s. Not here: the drivers themselves (drivers/*) and the driver suites (packages/testkit/src/contract/drivers/, component contract-harness, built in the same task 0-E03-T01 per FE-545 and FE-438); not the registration of the handler drivers-health in the role orchestrator (0-E05-T10, FE-439)."
design = [
  "04-effects-audit-credentials.md#24-drivers",
  "04-effects-audit-credentials.md#241-loading-and-capabilities",
  "04-effects-audit-credentials.md#25-metrics",
  "04-effects-audit-credentials.md#8-tests",
]
built_by = [
  "0-E03-T01",
  "8-E04-T03",
  "9-E02-T04",
]

[[provides]]
name = "load-drivers"
kind = "ts-api"
title = "loadDrivers(cfg, ctx) with LoadedDrivers (blob, secrets, identities including CapabilitySet)"
defined_in = "04-effects-audit-credentials.md#241-loading-and-capabilities"
from_task = "0-E03-T01"

[[provides]]
name = "konfig-treiber-auswahl"
kind = "config"
title = "installation.yaml: classes blob, secrets (exactly one driver each) and cloud_identity (list) with field driver"
defined_in = "04-effects-audit-credentials.md#241-loading-and-capabilities"
from_task = "0-E03-T01"

[[provides]]
name = "health-source"
kind = "ts-api"
title = "driverHealth(): latest HealthReports of the drivers (kind driver) from the single poll pollDriverHealth; HealthSource.latest() from 0-E19-T08 (alert rule driver_unhealthy) and the DriverHealthMonitor from 9-E02-T04 read from it, without calling health() themselves (FE-451)"
defined_in = "04-effects-audit-credentials.md#241-loading-and-capabilities"
from_task = "0-E03-T01"

[[provides]]
name = "queue-drivers-health"
kind = "queue"
title = "Handler pollDriverHealth of the pg-boss schedule drivers-health (every 60 s); registered by the role orchestrator (FE-439)"
defined_in = "04-effects-audit-credentials.md#3-data"
from_task = "0-E03-T01"

[[provides]]
name = "metrik-health"
kind = "metric"
title = "guildwork.health.ok with component blob, secrets, cloud_identity and id of the driver"
defined_in = "04-effects-audit-credentials.md#25-metrics"
from_task = "0-E03-T01"

[[provides]]
name = "driver-schemas"
kind = "ts-api"
title = "driverSchemas(): configuration schema per built-in driver under DriverSchemaKey (\"BlobStore:s3\" etc.) for LoadOptions.driverSchemas; type test DriverClass from config equals DriverKind from contracts (00 FE-051)"
defined_in = "04-effects-audit-credentials.md#241-loading-and-capabilities"
from_task = "0-E03-T01"

[[provides]]
name = "driver-issuer-kontext"
kind = "ts-api"
title = "DriverContext.issuer (DriverIssuer.mint) from the DriverContextFactory only for drivers with self_issuer; load order SecretStore, self-issuer, then self_issuer drivers; abort without self-issuer (FE-1342)"
defined_in = "04-effects-audit-credentials.md#241-loading-and-capabilities"
from_task = "8-E04-T03"

