id = "plugin-analyzer-opengrep"
title = "Analyzer opengrep with default rule set"
kind = "plugin"
path = "plugins/analyzer-opengrep/"
package = "@guildwork/plugin-analyzer-opengrep"
stage = "2"
purpose = "Analyzer plugin for opengrep with its own default rule set and the repo rules from the base SHA, offline in the image. Not: the Opengrep rule collection or third-party registry rules (ADR-50)."
design = ["10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"]
built_by = ["2-E05-T04"]

[[provides]]
name = "analyzer-vertrag"
kind = "contract"
title = "Implementation of the analyzer contract v1alpha1 (mode run, manifest, image deploy/images/analyzer-opengrep by digest, offline), contract suite AN1 with 20 fixture repos"
defined_in = "10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"
from_task = "2-E05-T04"

[[provides]]
name = "regelsatz-guildwork-default"
kind = "file"
title = "Own rule set plugins/analyzer-opengrep/rules/guildwork-default/ under Apache-2.0, one positive and one negative test per rule (FE-1030)"
defined_in = "10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"
from_task = "2-E05-T04"

[[provides]]
name = "repo-regeln"
kind = "file"
title = "Repo rules under .agents/rules/opengrep/ at the base SHA"
defined_in = "10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"
from_task = "2-E05-T04"

[[uses]]
interface = "contracts/vertrag-analyzer"
from_task = "2-E05-T04"
purpose = "Implement the analyzer contract v1alpha1 (run, describe, AnalyzerManifestExt)"

[[uses]]
interface = "contracts/manifest"
from_task = "2-E05-T04"
purpose = "Plugin manifest with license, distribution bundled, offline"

[[uses]]
interface = "contract-harness/an1-suite"
from_task = "2-E05-T04"
purpose = "Contract suite AN1 with 20 fixture repos"

[[uses]]
interface = "sarif/sarif-api"
from_task = "2-E05-T04"
purpose = "Fingerprints and required fields of the SARIF output"

[[uses]]
interface = "analyzer-runner/analyzer-runner-dienst"
from_task = "2-E05-T04"
purpose = "Execution in the tool sandbox without network"

[[uses]]
interface = "container-images/image.analyzer-opengrep"
from_task = "2-E05-T04"
purpose = "Image by digest"

[[uses]]
interface = "release-werkzeuge/image-lizenz-gate"
from_task = "2-E05-T04"
purpose = "License gate of the image"
