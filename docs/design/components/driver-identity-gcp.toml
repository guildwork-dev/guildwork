id = "driver-identity-gcp"
title = "CloudIdentity gcp"
kind = "driver"
path = "drivers/identity-gcp/"
package = "@guildwork/driver-identity-gcp"
stage = "8"
purpose = "Driver of the CloudIdentity contract for Google Cloud: identity token of the metadata service, exchange gcp_sts via Workload Identity Federation for the access token of the item service account and anthropic_wif, ambient or via the own issuer (FE-1340). Creates no service accounts."
design = [
  "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp",
  "13-stage-8-providers-and-bases.md#84-bases-8-e04",
]
built_by = ["8-E04-T03"]

[[provides]]
name = "cloudidentity"
kind = "contract"
title = "CloudIdentity gcp: ambientToken(aud), exchange gcp_sts and anthropic_wif with a fresh jti per exchange for self_issuer; ttlS clamped to maxTtlS; contract attestation"
defined_in = "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp"
from_task = "8-E04-T03"

[[provides]]
name = "konfig"
kind = "config"
title = "cloud_identity[] with driver gcp: GcpIdentityConfig (project, source, workloadIdentityProvider, itemServiceAccount, maxTtlS)"
defined_in = "13-stage-8-providers-and-bases.md#243-cloudidentity-azure-managed-identity-aws-and-gcp"
from_task = "8-E04-T03"

