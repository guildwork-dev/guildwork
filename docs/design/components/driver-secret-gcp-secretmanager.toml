id = "driver-secret-gcp-secretmanager"
title = "SecretStore gcp-secretmanager"
kind = "driver"
path = "drivers/secret-gcp-secretmanager/"
package = "@guildwork/driver-secret-gcp-secretmanager"
stage = "8"
purpose = "Driver of the SecretStore contract for Google Secret Manager with get, put as a new version (WRITE) and optionally sign via Cloud KMS (SIGN only with a proven probe); one secret per name with JSON fields (FE-1341). Creates no keys and no permissions."
design = [
  "13-stage-8-providers-and-bases.md#242-secretstore-aws-secretsmanager-and-gcp-secretmanager",
  "13-stage-8-providers-and-bases.md#84-bases-8-e04",
]
built_by = ["8-E04-T02"]

[[provides]]
name = "secretstore"
kind = "contract"
title = "SecretStore gcp-secretmanager: get(ref, version) with latest, put as a new version (WRITE), sign and publicKey via Cloud KMS (SIGN), not_found for an unknown version; contract attestation"
defined_in = "13-stage-8-providers-and-bases.md#242-secretstore-aws-secretsmanager-and-gcp-secretmanager"
from_task = "8-E04-T02"

[[provides]]
name = "konfig"
kind = "config"
title = "secrets with driver gcp-secretmanager: GcpSecretsConfig (project, namePrefix, auth ambient or self_issuer, kms.signKeyVersion)"
