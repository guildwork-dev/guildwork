id = "helm-chart"
title = "Helm chart with S8 on kind and k3d"
kind = "delivery"
path = "deploy/helm/guildwork/"
stage = "8"
purpose = "Helm chart for operation on Kubernetes: separate deployments for web, orchestrator, worker pools and egress proxy from signed images by digest, migrate as a hook before the rollout, sandbox namespace with NetworkPolicy, values schema; plus the S8 run on kind and k3d (FE-1231). No database in the chart, no ingress; the ExecutionBackend k8s is the separate component plugin-exec-k8s."
design = [
  "13-stage-8-providers-and-bases.md#244-helm-chart",
  "13-stage-8-providers-and-bases.md#47-helm-install-upgrade-and-s8",
  "13-stage-8-providers-and-bases.md#84-bases-8-e04",
]
built_by = ["8-E04-T04", "8-E04-T05"]

[[provides]]
name = "chart"
kind = "file"
title = "Chart deploy/helm/guildwork (templates for web, orchestrator, migrate job, worker and egress proxy per pool, sandbox namespace, NetworkPolicies, init container verify with cosign, PDB, optional embedder); helm install and upgrade"
defined_in = "13-stage-8-providers-and-bases.md#244-helm-chart"
from_task = "8-E04-T04"

[[provides]]
name = "werte"
kind = "config"
title = "values.yaml with values.schema.json (additionalProperties false): image, verify, installation.existingSecret, database.urlSecretRef, web, orchestrator, migrate, pools[], networkPolicy, ingress"
defined_in = "13-stage-8-providers-and-bases.md#244-helm-chart"
from_task = "8-E04-T04"

[[provides]]
