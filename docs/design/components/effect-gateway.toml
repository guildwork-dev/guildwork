id = "effect-gateway"
title = "Effect gateway: effect catalog, acceptance, idempotency, outbox, record and shadow, path and diff policies"
kind = "role"
path = "apps/control-plane/src/effects/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Sole write path to the outside: accepts write requests and platform effects, checks schema, target, policy, content and the checkers of later stages, assigns the idempotency key, keeps the outbox in effects and dispatches via the executors with retry and reconciliation. Calls no write method of a plugin itself (only the executors do that) and decides no policy rule POL-* (the policy engine does that)."
design = [
  "04-effects-audit-credentials.md#21-effect-gateway",
  "04-effects-audit-credentials.md#211-effect-catalog",
  "04-effects-audit-credentials.md#212-interface",
  "04-effects-audit-credentials.md#213-flow-of-submit",
  "04-effects-audit-credentials.md#214-idempotency-and-outbox",
  "04-effects-audit-credentials.md#216-modes-record-and-shadow",
  "04-effects-audit-credentials.md#217-checkers-of-later-stages",
  "04-effects-audit-credentials.md#25-metrics",
  "04-effects-audit-credentials.md#41-write-request-to-effect",
  "04-effects-audit-credentials.md#42-states-of-the-effect",
  "04-effects-audit-credentials.md#6-security",
  "04-effects-audit-credentials.md#7-configuration",
]
built_by = [
  "0-E09-T01",
  "0-E09-T02",
  "0-E09-T03",
  "0-E09-T04",
  "0-E09-T10",
