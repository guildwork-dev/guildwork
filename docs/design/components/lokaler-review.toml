id = "lokaler-review"
title = "Local review via CLI with NDJSON and remote execution"
kind = "service"
path = "services/reviewer/src/local/"
package = "@guildwork/service-reviewer"
stage = "6"
purpose = "Reviewer as a library with a local input (merge base, uncommitted changes, rules from the default branch) and the command guildwork review --local with NDJSON v1; with --remote a work item run origin cli via upload and event stream, without permitted write requests. Not here: dev token and login (entwickler-mcp) and the review pipeline itself (08)."
design = [
  "09-reviewer-companion-features-and-learnings.md#26-local-review-via-cli",
  "09-reviewer-companion-features-and-learnings.md#33-envelopes-and-formats",
  "09-reviewer-companion-features-and-learnings.md#34-endpoints",
  "09-reviewer-companion-features-and-learnings.md#44-local-review",
  "09-reviewer-companion-features-and-learnings.md#81-stage-6-per-module",
]
built_by = ["6-E04-T01", "6-E04-T02", "6-E04-T03"]

