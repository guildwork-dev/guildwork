purpose = "Implement WorkSnapshotService and WorkSnapshot"

[[uses]]
interface = "worker-umgebungs-snapshot/env-snapshot-dienst"
from_task = "2-E01-T13"
purpose = "Restore into a sandbox from the environment snapshot with the same key"

[[uses]]
interface = "plugin-analyzer-gitleaks/secret-regeln"
from_task = "2-E01-T13"
purpose = "Secret scan before storing"

[[uses]]
interface = "contracts/vertrag-execution-backend"
from_task = "2-E01-T13"
purpose = "copyOut and copyIn of the defined paths"

[[uses]]
interface = "work-api/http-results"
from_task = "2-E01-T13"
purpose = "Upload of the archive via upload-url"

[[uses]]
interface = "work-item-umschlag/envelope-v1"
from_task = "2-E01-T13"
purpose = "snapshotRef and sha256 in the envelope of coder.resume"

[[uses]]
interface = "db-migrator/migrationsdatei"
from_task = "2-E01-T13"
purpose = "Migration 0205 work_snapshots"

[[uses]]
interface = "db/repos"
from_task = "2-E01-T13"
purpose = "Repository work_snapshots"

[[uses]]
interface = "contracts/vertrag-blob-store"
