id = "pre-merge-checks"
title = "Pre-merge checks with check run ai-pre-merge-checks"
kind = "service"
path = "services/reviewer/src/premerge/"
package = "@guildwork/service-reviewer"
stage = "6"
purpose = "Built-in deterministic checks (title, description, linked issue, docstring coverage) and custom checks in natural language with mandatory evidence; result as a separate check run ai-pre-merge-checks without silent green. Not here: the check run ai-review of the findings (08) and the executor check (04)."
design = [
  "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks",
  "09-reviewer-companion-features-and-learnings.md#5-failure-and-abort-paths",
  "09-reviewer-companion-features-and-learnings.md#7-configuration",
  "09-reviewer-companion-features-and-learnings.md#81-stage-6-per-module",
]
built_by = ["6-E02-T01", "6-E02-T02", "6-E02-T03", "6-E02-T04", "6-E02-T05"]

[[provides]]
name = "premerge-typen"
kind = "ts-api"
title = "CheckMode, BuiltinChecksConfig, CustomCheckConfig, Evidence, PreMergeCheckResult"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T01"

[[provides]]
name = "konfig-checks"
kind = "config"
title = "services.reviewer.builtin_checks.* and services.reviewer.checks (format FE-912, at most 10) with resolver rules"
defined_in = "09-reviewer-companion-features-and-learnings.md#7-configuration"
from_task = "6-E02-T01"

[[provides]]
name = "eingebaute-checks"
kind = "ts-api"
title = "Built-in checks title, description, issue_linked (deterministic, FE-911)"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T02"

[[provides]]
name = "docstring-abdeckung"
kind = "ts-api"
title = "Built-in check docstring_coverage via PrepareOutput.symbolsTouched from the parser from 08 (FE-956)"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T03"

[[provides]]
name = "verify-evidence"
kind = "ts-api"
title = "verifyEvidence(e, ctx) and evaluation of custom checks with paths filter"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T04"

[[provides]]
name = "prompt-eigene-checks"
kind = "prompt"
title = "Single call per custom check in the job reviewer.companions with schema { result, reason, evidence[] }"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T04"

[[provides]]
name = "check-run-ai-pre-merge-checks"
kind = "contract"
title = "conclusionOf(results) and check run ai-pre-merge-checks (name and result rules that branch rules can point to)"
defined_in = "09-reviewer-companion-features-and-learnings.md#24-pre-merge-checks"
from_task = "6-E02-T05"

[[provides]]
name = "metrik-premerge"
kind = "metric"
title = "guildwork.reviewer.premerge.results"
defined_in = "09-reviewer-companion-features-and-learnings.md#51-metrics-and-alarms"
from_task = "6-E02-T05"

