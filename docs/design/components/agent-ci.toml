id = "agent-ci"
title = "CI on agent branches: check per claim and in doctor, agent_fork with command and contract test"
kind = "role"
path = "apps/control-plane/src/agent-ci/"
package = "@guildwork/control-plane"
stage = "2"
purpose = "Enforces security.agent_ci: check of the CI variant on every claim of the coder (hook for QA and PR fixer) and in doctor with a cache by cacheKey, otherwise no_safe_ci; variant agent_fork with creation by the operator, push and PR from the fork and a real contract test. Not: the pure analysis of the workflow files (workflow-guard)."
design = ["10-planner-architect-coder.md#49-check-securityagent_ci-per-claim", "10-planner-architect-coder.md#216-ci-on-agent-branches-guildworkworkflow-guard", "10-planner-architect-coder.md#220-cli-commands-and-doctor-checks-of-stage-2", "10-planner-architect-coder.md#86-ci-on-agent-branches-2-e06"]
built_by = ["2-E06-T02", "2-E06-T03", "2-E06-T05", "2-E06-T06"]

