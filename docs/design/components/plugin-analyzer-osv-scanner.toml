id = "plugin-analyzer-osv-scanner"
title = "Analyzer osv-scanner"
kind = "plugin"
path = "plugins/analyzer-osv-scanner/"
package = "@guildwork/plugin-analyzer-osv-scanner"
stage = "2"
purpose = "Analyzer plugin for osv-scanner with an offline database that the worker maintains (with air_gap from the registry mirror). Not: the osv cross-check of propose_dependency (propose-dependency)."
design = ["10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"]
built_by = ["2-E05-T05"]

[[provides]]
name = "analyzer-vertrag"
kind = "contract"
title = "Implementation of the analyzer contract v1alpha1 (mode run, manifest, image deploy/images/analyzer-osv-scanner by digest, offline), contract suite AN1 with 20 fixture repos"
defined_in = "10-planner-architect-coder.md#214-analyzer-in-run-mode-guildworksarif-plugins"
from_task = "2-E05-T05"

[[uses]]
interface = "contracts/vertrag-analyzer"
from_task = "2-E05-T05"
purpose = "Implement the analyzer contract v1alpha1 (run, describe, AnalyzerManifestExt)"

[[uses]]
interface = "contracts/manifest"
from_task = "2-E05-T05"
purpose = "Plugin manifest with license, distribution bundled, offline"

[[uses]]
interface = "contract-harness/an1-suite"
from_task = "2-E05-T05"
purpose = "Contract suite AN1 with 20 fixture repos"

[[uses]]
interface = "sarif/sarif-api"
from_task = "2-E05-T05"
purpose = "Fingerprints and required fields of the SARIF output"

[[uses]]
interface = "analyzer-runner/analyzer-runner-dienst"
from_task = "2-E05-T05"
purpose = "Execution in the tool sandbox without network"

[[uses]]
interface = "container-images/image.analyzer-gitleaks-osv"
from_task = "2-E05-T05"
purpose = "Image by digest"

[[uses]]
interface = "release-werkzeuge/image-lizenz-gate"
from_task = "2-E05-T05"
purpose = "License gate of the image"

[[uses]]
interface = "analyzer-runner/offline-db"
from_task = "2-E05-T05"
purpose = "Offline database volume, maintained by the worker"

[[uses]]
interface = "config-installation/installation-yaml"
from_task = "2-E05-T05"
purpose = "air_gap and registry_mirror as the source of the database"
