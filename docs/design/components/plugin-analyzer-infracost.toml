id = "plugin-analyzer-infracost"
title = "Analyzer Infracost"
kind = "plugin"
path = "plugins/analyzer-infracost/"
package = "@guildwork/plugin-analyzer-infracost"
stage = "10"
purpose = "Produces a cost diff for IaC (HCL) between base and head as a properties bag that the Reviewer shows deterministically in its summary. No findings, no prompt context; whether price data needs an account is unverified (backlog M35, until then byo_license)."
design = [
  "15-stage-10-edge-layers.md#262-analyzer-infracost",
  "15-stage-10-edge-layers.md#263-shared-rules-of-the-three-new-analyzers",
  "15-stage-10-edge-layers.md#264-an1",
  "15-stage-10-edge-layers.md#84-analyzers-10-e04",
]
built_by = ["10-E04-T02", "10-E04-T03"]

[[provides]]
name = "analyzer"
kind = "contract"
title = "Analyzer contract v1alpha1: manifestExt, describe (network allowlist), run with InfracostConfig, AnalyzerReport without findings"
defined_in = "15-stage-10-edge-layers.md#262-analyzer-infracost"
from_task = "10-E04-T02"

[[provides]]
name = "beutel-cost-diff"
kind = "ts-api"
title = "properties bag guildwork/cost-diff@1 (CostDiffBag) in packages/sarif/src/bags/cost-diff.ts"
