id = "plugin-linear"
title = "Linear"
kind = "plugin"
path = "plugins/linear/"
package = "@guildwork/plugin-linear"
stage = "9"
purpose = "Linear as a ticket source with Agent Sessions: TriggerSource for session events with deadlines 5 s and 10 s, WorkItemProvider with session instead of a status comment, plus the E2E cases for ask from Jira and Linear. Not: operating mode private (no polling), code hoster functions."
design = [
  "14-stage-9-breadth-and-hardening.md#221-linear",
  "14-stage-9-breadth-and-hardening.md#223-ask-from-jira-and-linear",
  "14-stage-9-breadth-and-hardening.md#43-linear-agent-session",
  "14-stage-9-breadth-and-hardening.md#82-linear-and-notifiers-9-e02",
]
built_by = ["9-E02-T01", "9-E02-T03"]

[[provides]]
name = "trigger-source"
kind = "contract"
title = "TriggerSource Linear: agent session events created (delegated, mentioned), prompted, stop; signature before parsing; ack via session.activity"
defined_in = "14-stage-9-breadth-and-hardening.md#221-linear"
from_task = "9-E02-T01"

[[provides]]
name = "work-item-provider"
kind = "contract"
title = "WorkItemProvider Linear with session.* (start, activity, plan), delegation, externalUrls, transitions, labels, create and link issues"
defined_in = "14-stage-9-breadth-and-hardening.md#221-linear"
from_task = "9-E02-T01"

[[provides]]
name = "konfig-linear"
kind = "config"
title = "plugins.work_items[linear]: LinearInstanceConfig (workspace, apiUrl, appActorId, auth, webhookSecretRef, teamAllowlist, statusMapping)"
defined_in = "14-stage-9-breadth-and-hardening.md#221-linear"
from_task = "9-E02-T01"

[[provides]]
name = "team-sichtbarkeit"
kind = "config"
title = "plugins.work_items[].visibility.<TEAM>: visibility of a Linear team as an output target per FE-1253 (org level only)"
defined_in = "14-stage-9-breadth-and-hardening.md#7-configuration"
from_task = "9-E02-T01"

[[provides]]
name = "work-item-sessions"
kind = "table"
title = "Table work_item_sessions (migration 0903): one session per run and work item, last_version for idempotency"
defined_in = "14-stage-9-breadth-and-hardening.md#31-tables-block-0900"
from_task = "9-E02-T01"

[[provides]]
name = "linear-ack-latency-seconds"
kind = "metric"
title = "guildwork.effect.ack_latency (histogram, s, plugin): time from inbox.received_at to effects.applied_at of the ack; alert rule ack_latency_exceeded"
defined_in = "14-stage-9-breadth-and-hardening.md#51-metrics-of-this-area"
from_task = "9-E02-T01"

[[provides]]
name = "e2e-suite"
kind = "file"
title = "E2E suite eval/suites/e2e/linear/ (plan from linear) with recording"
defined_in = "14-stage-9-breadth-and-hardening.md#82-linear-and-notifiers-9-e02"
from_task = "9-E02-T01"

[[provides]]
name = "e2e-ask-tickets"
kind = "file"
title = "E2E suite eval/suites/s5/ask-tickets/: ask from Jira and Linear with valid citations and visibility rule"
