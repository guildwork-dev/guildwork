id = "abnahme-werkzeug"
title = "Acceptance matrix and collective run of the contract suites"
kind = "tool"
path = "tools/acceptance/"
stage = "0"
purpose = "Acceptance matrix per stage as TOML with the check tool check.py, which proves each named test and its green state on main, and a collective run of the contract suites with a report (FE-635); builds no suite and no test itself."
design = ["06-installation-operations-ui.md#810-acceptance-matrix", "06-installation-operations-ui.md#218-check-tools-for-release-portability-and-acceptance"]
built_by = ["0-E22-T02", "0-E22-T05"]

[[provides]]
name = "abnahme-matrix"
kind = "file"
title = "tools/acceptance/stage-<stage>.toml with [[kriterium]] id, text, tests, aufgabe (stages 0 and 0b; later stages in the same format)"
defined_in = "06-installation-operations-ui.md#810-acceptance-matrix"
from_task = "0-E22-T02"

[[provides]]
name = "acceptance-check"
kind = "cli"
title = "tools/acceptance/check.py --stage <s> --junit <dir>"
defined_in = "06-installation-operations-ui.md#218-check-tools-for-release-portability-and-acceptance"
from_task = "0-E22-T02"

[[provides]]
name = "contracts-report"
kind = "cli"
title = "acceptance.yml job acceptance-contracts and contracts_report.py with suite version and fixture hash per plugin and driver"
defined_in = "06-installation-operations-ui.md#218-check-tools-for-release-portability-and-acceptance"
from_task = "0-E22-T05"

[[uses]]
interface = "ci-workflows/ci-yml"
