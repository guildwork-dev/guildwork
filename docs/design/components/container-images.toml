id = "container-images"
title = "Container images control-plane, sandbox-base, agent-worker, egress-proxy and tool images"
kind = "delivery"
path = "deploy/images/"
stage = "0"
purpose = "Builds all OCI images of the platform for amd64 and arm64 by digest, without root, with healthcheck, labels and license gate, including the workflow images.yml; provides the four core images and the shared tool images, not the images that their introducing component provides itself (registry-cache, mermaid-check, embedder, engines; table in 06 section 2.2); not the programs in the images and not the release (release-werkzeuge)."
design = ["06-installation-operations-ui.md#22-container-images", "06-installation-operations-ui.md#212-supply-chain-and-release"]
built_by = ["0-E18-T01", "0-E18-T02", "1-E02-T03", "2-E01-T07", "2-E01-T11", "2-E03-T04", "2-E05-T04", "2-E05-T05", "2-E05-T06", "3-E03-T01", "7-E01-T04"]

[[provides]]
name = "image.control-plane"
kind = "file"
title = "Image control-plane with roles web, orchestrator, migrate, ops, all by argument, pg_dump, pg_restore, psql 18, restic and git (SCMProvider.push via Git bundle, 05 FE-516)"
defined_in = "06-installation-operations-ui.md#22-container-images"
from_task = "0-E18-T01"

[[provides]]
name = "image.sandbox-base"
kind = "file"
title = "Image sandbox-base: bash, git, curl, tini, Node 22, python3, user agent (uid 10001) without sudo; platform tools under /opt/guildwork/bin/ (gw-review-context from 1-E02-T03, gw-kb-indexer from 7-E01-T04, FE-651)"
defined_in = "06-installation-operations-ui.md#22-container-images"
from_task = "0-E18-T01"

[[provides]]
name = "images-workflow"
kind = "file"
title = "Workflow images.yml: matrix per image under deploy/images/<image>/, native on ubuntu-24.04 and ubuntu-24.04-arm, push by digest, manifest list, weekly rebuild, workflow_call from release.yml"
defined_in = "06-installation-operations-ui.md#22-container-images"
from_task = "0-E18-T01"

[[provides]]
name = "image.agent-worker"
