id = "plugin-jira-cloud"
title = "Jira Cloud: TriggerSource and WorkItemProvider"
kind = "plugin"
path = "plugins/jira-cloud/"
package = "@guildwork/plugin-jira-cloud"
stage = "8"
purpose = "One plugin with the kinds TriggerSource (ingress via admin webhook or automation relay, catch-up via JQL) and WorkItemProvider (read tickets and write them via the Effect Gateway) for Jira Cloud (ADR-09). Not included: identity linking, permission AND check and visibility of ticket targets (control plane) and ADF conversion (@guildwork/adf)."
design = [
  "13-stage-8-providers-and-bases.md#211-package-manifest-and-capabilities",
  "13-stage-8-providers-and-bases.md#212-triggersource-jira-cloud",
  "13-stage-8-providers-and-bases.md#213-workitemprovider-jira-cloud-reading",
  "13-stage-8-providers-and-bases.md#214-workitemprovider-jira-cloud-writing",
  "13-stage-8-providers-and-bases.md#218-ask-and-control-commands-from-jira",
  "13-stage-8-providers-and-bases.md#219-spike-fixtures-and-recording",
  "13-stage-8-providers-and-bases.md#41-jira-ingress-to-inbox",
  "13-stage-8-providers-and-bases.md#42-jira-mention-to-ticket-to-pr",
  "13-stage-8-providers-and-bases.md#81-jira-8-e01",
]
# 8-E01-T10 added: the E2E proof "Jira mention equals GitHub mention" is the acceptance of this plugin
# (eval/suites/s5/jira); otherwise the task would belong to no component.
built_by = ["8-E01-T02", "8-E01-T04", "8-E01-T05", "8-E01-T06", "8-E01-T09", "8-E01-T10"]

