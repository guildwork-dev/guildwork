id = "reviewer-chat-und-befehle"
title = "Chat in the thread, remember, pause and resume"
kind = "service"
path = "services/reviewer/src/chat/"
package = "@guildwork/service-reviewer"
stage = "6"
purpose = "Replies in threads of the platform (classification, finding feedback with actor_role, reply via propose_reply) and the commands @agent remember, @agent pause and @agent review including the pause state (services/reviewer/src/chat/ and src/pause/); in stage 6 creates the tables learnings and learning_events and stores candidates. Not here: the lifecycle of the Learnings from 7a on (learnings-lebenszyklus) and the gate that reads the pause (08)."
