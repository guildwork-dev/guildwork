id = "sdk-service"
title = "Package sdk-service: step API, envelope, platform MCP client for services (types of the controller side in 0-E13-T11, the rest with the first users)"
kind = "package"
path = "packages/sdk-service/"
package = "@guildwork/sdk-service"
stage = "0"
purpose = "The only interface of the services to the platform: service definition, controller contract with the host of the control plane, job handler with context in the worker, reading of the envelope inputs and platform MCP client. Only types, ports and helpers; the ports are implemented by the control plane and the worker."
