kind = "ts-api"
title = "SearchRequest, SearchHit, ItemCitation, rrf() and identTokens() for the lexical and the vector leg"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T08"

[[provides]]
name = "mcp-tool-typen"
