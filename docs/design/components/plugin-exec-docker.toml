id = "plugin-exec-docker"
title = "ExecutionBackend docker-sysbox and docker-gvisor"
kind = "plugin"
path = "plugins/exec-docker/"
package = "@guildwork/plugin-exec-docker"
stage = "0"
area = "03"
purpose = "Implements the ExecutionBackend contract for Docker with sysbox or gvisor isolation: item network, volumes, hardened container without resolver, exec, copyIn, copyOut, exportBundle and complete destroy, all via the socket proxy. No snapshot, no dispatch and no weaker isolation as a fallback."
design = [
  "03-execution.md#27-sandbox-executionbackend-docker-sysbox-and-docker-gvisor",
  "03-execution.md#293-dns-without-a-back-channel-adr-64",
  "03-execution.md#8-tests",
]
built_by = ["0-E12-T03", "0-E12-T06"]

