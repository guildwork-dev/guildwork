id = "plugin-model-local-embed"
title = "ModelProvider local-embed"
kind = "plugin"
path = "plugins/model-local-embed/"
package = "@guildwork/plugin-model-local-embed"
stage = "7"
purpose = "Connects the service embedder as a ModelProvider with the capability EMBEDDINGS to the control plane; without a reachable service it reports EMBEDDINGS none, and the core switches off vector search per rule 2. No text model: generate answers unsupported, the resolver allows it only as knowledge.embed_model."
design = [
  "12-expansion.md#22-embedder-and-vector-search-7-e01",
]
built_by = [
  "7-E01-T07",
]

[[provides]]
name = "modelprovider-local-embed"
kind = "contract"
title = "ModelProvider local-embed: models() and embed() with EMBEDDINGS native when the service is reachable, otherwise none; per model the IDs <name> and <name>:query (FE-1259)"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T07"

[[provides]]
name = "konfig-local-embed"
kind = "config"
title = "LocalEmbedConfig of the plugin instance: url, timeoutMs, batchSize"
defined_in = "12-expansion.md#22-embedder-and-vector-search-7-e01"
from_task = "7-E01-T07"

[[provides]]
name = "metrik-embedder"
kind = "metric"
title = "guildwork.embedder.errors (code) and required alert embedder_unavailable after 30 minutes of outage (section 5.1)"
defined_in = "12-expansion.md#51-metrics-alarms-and-audit-actions-of-stage-7"
from_task = "7-E01-T07"

[[uses]]
interface = "contracts/vertrag-model-provider"
from_task = "7-E01-T07"
purpose = "Implement ModelProvider with models, embed and generate (unsupported)"

[[uses]]
interface = "contracts/plugin-basis"
from_task = "7-E01-T07"
purpose = "PluginBase with ctx.http for calls to the service embedder"

[[uses]]
interface = "contracts/manifest"
from_task = "7-E01-T07"
purpose = "Plugin manifest with egress only to the internal host of the service"

[[uses]]
interface = "plugin-rahmen/plugin-registry"
from_task = "7-E01-T07"
purpose = "Register as BuiltinPluginPackage"

[[uses]]
interface = "contract-harness/plugin-suites"
from_task = "7-E01-T07"
purpose = "Pass the contract suite ModelProvider (EMBEDDINGS native or none)"

[[uses]]
interface = "contract-harness/attestation"
from_task = "7-E01-T07"
purpose = "contract-attestation.json for the plugin"

[[uses]]
interface = "embedder/http-embed"
from_task = "7-E01-T07"
purpose = "Call POST /v1/embed and GET /v1/health of the service"

[[uses]]
interface = "config-resolver/consistency-rule"
from_task = "7-E01-T07"
purpose = "Resolver rule: local-embed only in knowledge.embed_model"

[[uses]]
interface = "core/metrik-katalog"
from_task = "7-E01-T07"
purpose = "guildwork.embedder.errors in the catalog (section 5.1)"

[[uses]]
interface = "alarm-automat/alert-rule"
from_task = "7-E01-T07"
purpose = "Alert rule embedder_unavailable (section 5.1)"
