id = "arbeitsstand-snapshot"
title = "Work-state snapshot and restore"
kind = "role"
path = "apps/worker/src/work-snapshot/"
package = "@guildwork/worker"
stage = "2"
purpose = "Saves the work state of an agent (workspace with .git and the configuration directory of the harness) after a secret scan as an archive and restores it for a clarifying question, steering, deadline expiry and rate limit pause; plus the deletion job after expiry. Not: a container image and not the environment snapshot (worker-umgebungs-snapshot)."
design = ["10-planner-architect-coder.md#29-work-state-snapshot-and-restore", "10-planner-architect-coder.md#45-question-and-continuation-l1"]
built_by = ["2-E01-T13", "2-E04-T09"]

[[provides]]
name = "work-snapshot-dienst"
kind = "ts-api"
title = "Implementation of WorkSnapshotService.create and restore (check of sha256, harness version, envSnapshotKey)"
defined_in = "10-planner-architect-coder.md#29-work-state-snapshot-and-restore"
from_task = "2-E01-T13"

[[provides]]
name = "snapshots-endpunkt"
kind = "http"
title = "POST /work/v1/leases/{leaseId}/snapshots"
defined_in = "10-planner-architect-coder.md#219-endpoints"
from_task = "2-E01-T13"

[[provides]]
name = "tabelle-work-snapshots"
kind = "table"
title = "work_snapshots (migration 0205)"
defined_in = "10-planner-architect-coder.md#32-new-tables-migrations-0200-to-0299-fe-1049"
from_task = "2-E01-T13"

[[provides]]
name = "arbeitsstand-archiv"
kind = "file"
title = "Archive t/<tenant>/runs/<runId>/work-snapshots/<snapshotRef>.tar.zst until expires_at"
defined_in = "10-planner-architect-coder.md#34-blobstore-keys"
from_task = "2-E01-T13"

[[provides]]
name = "queue-work-snapshots-expire"
kind = "queue"
title = "pg-boss schedule work-snapshots-expire (role orchestrator, singleton, FE-1072)"
defined_in = "10-planner-architect-coder.md#29-work-state-snapshot-and-restore"
from_task = "2-E01-T13"

[[provides]]
name = "konfig-expire"
kind = "config"
title = "work_snapshots.expire_interval_min (installation)"
defined_in = "10-planner-architect-coder.md#7-configuration"
from_task = "2-E01-T13"

[[uses]]
interface = "agent-step/job-context"
