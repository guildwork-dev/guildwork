id = "reviewer-begleitausgaben"
title = "Companion outputs: walkthrough, diagram, related items, labels, reviewer suggestions, effort"
kind = "service"
path = "services/reviewer/src/companions/"
package = "@guildwork/service-reviewer"
stage = "6"
purpose = "Generates in the work item reviewer.companions the companion outputs of the reviewer (walkthrough with change table, sequence diagram, related items, labels, reviewer suggestions, effort, risk level) and checks every output deterministically before it goes into the summary. Not here: pre-merge checks, findings of the finders and the posting itself (poster from 08, executor labels from 04)."
design = [
  "09-reviewer-companion-features-and-learnings.md#23-companion-generators",
  "09-reviewer-companion-features-and-learnings.md#33-envelopes-and-formats",
  "09-reviewer-companion-features-and-learnings.md#41-companion-outputs-in-a-review-run",
  "09-reviewer-companion-features-and-learnings.md#5-failure-and-abort-paths",
  "09-reviewer-companion-features-and-learnings.md#7-configuration",
  "09-reviewer-companion-features-and-learnings.md#81-stage-6-per-module",
]
built_by = ["6-E01-T01", "6-E01-T02", "6-E01-T03", "6-E01-T04", "6-E01-T06", "6-E01-T07", "6-E01-T08"]

