from_task = "6-E04-T01"

[[provides]]
name = "cli-review-local"
kind = "cli"
title = "guildwork review --local [--uncommitted] [--base] [--format ndjson|text] [--min-severity] with exit codes 0, 1, 2 (FE-917)"
