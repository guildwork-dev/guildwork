id = "driver-secret-aws-secretsmanager"
title = "SecretStore aws-secretsmanager"
kind = "driver"
path = "drivers/secret-aws-secretsmanager/"
package = "@guildwork/driver-secret-aws-secretsmanager"
stage = "8"
purpose = "Driver of the SecretStore contract for AWS Secrets Manager with get, put (WRITE) and optionally sign via KMS (SIGN only with a proven probe); one secret per name with JSON fields (FE-1341). Creates no KMS keys and no IAM permissions."
design = [
  "13-stage-8-providers-and-bases.md#242-secretstore-aws-secretsmanager-and-gcp-secretmanager",
  "13-stage-8-providers-and-bases.md#84-bases-8-e04",
]
built_by = ["8-E04-T02"]

[[provides]]
name = "secretstore"
kind = "contract"
title = "SecretStore aws-secretsmanager: get(ref, version), put (WRITE), sign and publicKey via KMS (SIGN), not_found for an unknown version; contract attestation"
defined_in = "13-stage-8-providers-and-bases.md#242-secretstore-aws-secretsmanager-and-gcp-secretmanager"
from_task = "8-E04-T02"

[[provides]]
name = "konfig"
kind = "config"
title = "secrets with driver aws-secretsmanager: AwsSecretsConfig (region, namePrefix, auth ambient or self_issuer with roleArn, kms.signKeyId)"
defined_in = "13-stage-8-providers-and-bases.md#242-secretstore-aws-secretsmanager-and-gcp-secretmanager"
from_task = "8-E04-T02"

