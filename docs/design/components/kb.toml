id = "kb"
title = "Package kb: layer types, LayerDelta, queries, hybrid search"
kind = "package"
path = "packages/kb/"
package = "@guildwork/kb"
stage = "7"
purpose = "Shared types and pure functions of the knowledge base from stage 7: layers L0 to L5, the LayerDelta as the result of the indexer jobs, the query types of the KnowledgeStore, the hybrid search with RRF and the types of the kb.* tools. No database access and no query implementation (that lives in plugins/pg-kb), no jobs (service indexer)."
design = [
  "12-expansion.md#21-indexer-l1-to-l3-7-e01",
  "12-expansion.md#22-embedder-and-vector-search-7-e01",
  "12-expansion.md#23-mcp-tools-kb-and-ask-7-e02",
  "12-expansion.md#34-envelopes-and-file-formats",
]
built_by = [
  "7-E01-T02",
  "7-E01-T05",
  "7-E01-T08",
  "7-E02-T01",
  "7-E03-T02",
]

[[provides]]
name = "schicht-typen"
kind = "ts-api"
title = "Layer, LayerStatus, LayerVersions, LayerState, KbErrorCode"
defined_in = "12-expansion.md#21-indexer-l1-to-l3-7-e01"
from_task = "7-E01-T02"

[[provides]]
name = "layer-delta"
kind = "ts-api"
title = "LayerDelta with LayerRecord (L1FileRecord, L2SummaryRecord, L3ChunkRecord) and SkippedFile; TypeBox schema deltaV 1, control plane N reads N and N-1"
