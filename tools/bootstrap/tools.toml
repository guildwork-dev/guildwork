url = "https://github.com/opengrep/opengrep/releases/download/v{version}/opengrep_{target}"
source = "https://github.com/opengrep/opengrep/releases/tag/v1.32.0"
retrieved = "2026-11-01"
target = { linux_x64 = "manylinux_x86", linux_arm64 = "manylinux_aarch64", darwin_arm64 = "osx_arm64" }
sha256 = { linux_x64 = "7360d60174880bd9214f2dfbe439b7bce82b7a3d44cfe945ba833c85cc8bda75", linux_arm64 = "dc6229319c0d68948733053786a5614873947e5ec1d4669cc0e94ae9038cb99d", darwin_arm64 = "e161746226bccef5b85c57611946fa21dc3b00a2dc2591343d6160af99397e2f" }

