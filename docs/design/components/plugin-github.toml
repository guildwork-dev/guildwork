kind = "file"
title = "plugins/github/manifest.github.json (TriggerSource, SCMProvider) and manifest.github-issues.json (WorkItemProvider)"
defined_in = "05-plugins-and-contracts.md#2141-manifests-and-configuration-ruling-fe-513"
from_task = "0-E14-T03"

[[provides]]
name = "instanz-konfiguration"
kind = "config"
title = "Instance configuration github (instance, app_id_ref, key_ref, webhook_secret_ref, client_id_ref, api_url, web_url, mention_handle, mode, reconcile.max_pages, ack, audit_anchor_branch) and github-issues ({ scm }); the cadence of reconcile and poll comes from trigger.* of the control plane"
defined_in = "05-plugins-and-contracts.md#2141-manifests-and-configuration-ruling-fe-513"
from_task = "0-E14-T03"

[[provides]]
