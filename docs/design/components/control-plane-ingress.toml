id = "control-plane-ingress"
title = "Ingress with signature check, inbox, dedupe, reconcile and poll"
kind = "role"
path = "apps/control-plane/src/ingress/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Accepts webhooks, relays and ci_event per plugin instance, checks the signature on the raw body before any parsing, puts raw data into the BlobStore and the inbox, normalizes asynchronously into events with dedupe and catches up via reconcile and poll. Decides nothing about routes, permissions or runs; the router does that."
design = [
  "02-control-plane.md#41-ingress",
  "02-control-plane.md#42-event-schema-and-normalization",
  "02-control-plane.md#5-failure-and-abort-paths",
  "02-control-plane.md#6-security",
]
built_by = ["0-E04-T02", "0-E04-T03", "0-E04-T04", "0-E04-T07", "0-E04-T08", "8-E01-T09"]

[[provides]]
name = "ingress-endpunkt"
kind = "http"
title = "POST /v1/ingress/{instanceId}: 202, 200 duplicate, 401, 404, 413, 429, 503 (FE-201)"
defined_in = "02-control-plane.md#41-ingress"
from_task = "0-E04-T02"

[[provides]]
name = "ingress-process"
kind = "queue"
title = "Queue ingress-process with payload { inboxId, tenantId }, singletonKey inboxId; the handler parses and stores events"
defined_in = "02-control-plane.md#3-data"
from_task = "0-E04-T04"

[[provides]]
name = "trigger-queues"
kind = "queue"
title = "Queues trigger-reconcile and trigger-poll with payload { tenantId, pluginInstanceId }, schedule per instance"
defined_in = "02-control-plane.md#3-data"
from_task = "0-E04-T07"

[[provides]]
name = "konfig-ingress"
kind = "config"
title = "ingress.max_body_bytes, quarantine_max_bytes, rate_per_instance_per_min, reject_alarm_per_min, dedupe_window_h"
defined_in = "02-control-plane.md#7-configuration"
from_task = "0-E04-T02"

[[provides]]
name = "konfig-trigger"
kind = "config"
title = "trigger.reconcile_interval (default 10m) and trigger.poll_interval: interval of the schedules per instance, the instance value of the plugin takes precedence; the only provider of these values (FE-219)"
defined_in = "02-control-plane.md#7-configuration"
from_task = "0-E04-T07"

[[provides]]
name = "metriken"
kind = "metric"
title = "guildwork.ingress.rejected, duplicate, unavailable, parse_failed, skipped"
defined_in = "02-control-plane.md#51-metrics-of-this-area"
from_task = "0-E04-T08"

[[provides]]
name = "router-route"
kind = "queue"
title = "Queue router-route with payload { eventId, receivedAt, tenantId }, sent in the transaction of the new event; the handler is the router (FE-275)"
defined_in = "02-control-plane.md#3-data"
from_task = "0-E04-T04"

[[provides]]
name = "plugin-lookup"
kind = "ts-api"
title = "PluginLookup (triggerSource, scm, workItems per instance) via PluginRegistry.get, for all areas of the control plane (FE-214)"
defined_in = "02-control-plane.md#23-ports-to-other-areas"
from_task = "0-E04-T02"

[[provides]]
name = "blob-store-port"
kind = "ts-api"
title = "BlobStorePort.putTracked and get with BlobClass: object into the BlobStore and row in blob_refs in the caller's transaction (FE-215)"
defined_in = "02-control-plane.md#23-ports-to-other-areas"
from_task = "0-E04-T02"

