title = "DockerExecutionBackend (ExecutionBackend v1alpha1) and SandboxHandle with exec, spawn, copyIn, copyOut, exportBundle, destroy; manifest.json"
defined_in = "03-execution.md#27-sandbox-executionbackend-docker-sysbox-and-docker-gvisor"
from_task = "0-E12-T03"

[[provides]]
