id = "guidelines"
title = "Guideline loader (stage 1 inside the Reviewer, from stage 7 its own package)"
kind = "package"
path = "packages/guidelines/"
package = "@guildwork/guidelines"
stage = "1"
purpose = "Loads guidelines and rule files only at the base SHA and selects them per path with a budget and a stable rule ID; in stage 1 as the export ./guidelines of @guildwork/service-reviewer under services/reviewer/src/guidelines/, from stage 7 as the package @guildwork/guidelines with all formats. Does not evaluate rules (that is done by the finder standards and the standards service)."
