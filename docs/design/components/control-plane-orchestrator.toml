id = "control-plane-orchestrator"
title = "Orchestrator with run state machine, intake, steps, deadlines, status comment, queues"
kind = "role"
path = "apps/control-plane/src/orchestrator/"
package = "@guildwork/control-plane"
stage = "0"
purpose = "Drives every run according to the run state machine (one JSON file as the only source): intake with object lock and reservation, transitions in one transaction, steps via the service controllers, control commands, deadlines, status comment, lifting on upgrade, plus the list and registration of all queues. Decides no policy and no budget itself and never writes past the Effect Gateway."
design = [
  "02-control-plane.md#44-orchestrator-and-run-state-machine",
  "02-control-plane.md#45-run-start-intake",
  "02-control-plane.md#49-queues-pg-boss",
  "02-control-plane.md#492-queue-definitions-and-handlers",
  "02-control-plane.md#3-data",
  "02-control-plane.md#10-open-points",
]
