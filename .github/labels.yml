# Versioned label set of the repository (GOVERNANCE.md, section Triage).
# Each entry: name, color (hex without #), description.

# Status
- name: "status: triage"
  color: "fbca04"
  description: "New, not yet looked at by a maintainer"
- name: "status: needs-info"
  color: "fbca04"
  description: "Waiting for information from the reporter"
- name: "status: accepted"
  color: "fbca04"
  description: "Confirmed and open for work"
- name: "status: blocked"
  color: "fbca04"
  description: "Waiting on another issue or an external change"
- name: "status: declined"
  color: "fbca04"
  description: "Will not be done; the reason is in the issue"

