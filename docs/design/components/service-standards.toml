id = "service-standards"
title = "Standards service: rule metrics with UI page, miner, rule PR, compilation, decay"
kind = "service"
path = "services/standards/"
package = "@guildwork/service-standards"
stage = "7"
purpose = "Measures per rule (rule_id) findings, acceptance and addressed rate, derives rule candidates from accepted feedback, proposes them as a PR on .agents/rules/, compiles confirmed model findings into ast-grep or Opengrep rules with test cases and proposes the withdrawal of weak rules. The only write request is propose_change on .agents/rules/; the service activates no rule itself (merge by CODEOWNERS, auto_activate only at installation level) and loads no guidelines (that is done by @guildwork/guidelines)."
design = [
  "12-expansion.md#25-standards-service-7-e03",
  "12-expansion.md#31-tables-of-stage-7",
  "12-expansion.md#34-envelopes-and-file-formats",
  "12-expansion.md#35-endpoints",
  "12-expansion.md#43-standards-run-and-rule-pr",
  "12-expansion.md#5-failure-and-abort-paths",
  "12-expansion.md#7-configuration",
]
built_by = [
  "7-E03-T01",
  "7-E03-T02",
  "7-E03-T03",
  "7-E03-T04",
  "7-E03-T05",
  "7-E03-T06",
]

