title = "compose.yaml: services postgres, migrate, control-plane, ops, caddy, worker, socket-proxy, egress-proxy (also in worker-uplink, FE-658); networks edge, core, worker-uplink, worker-egress, egress-out, otel; volumes and mounts (harness-cache as gw-harness-cache under /var/lib/guildwork/harness); includes observability.compose.yaml from telemetry via include"
defined_in = "06-installation-operations-ui.md#23-compose-bundle-single-host"
from_task = "0-E18-T03"

