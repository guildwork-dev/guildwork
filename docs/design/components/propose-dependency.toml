id = "propose-dependency"
title = "Write request propose_dependency with allowlist, osv and approval"
kind = "role"
path = "apps/worker/src/dependency/"
package = "@guildwork/worker"
stage = "2"
purpose = "Lets the coder request an additional dependency: check against the exact name allowlist in the control plane (MCP tool), clarifying question for a name that is not allowed, resolution of the transitive closure in the resolver container and osv check in the worker, storage in the registry cache. Not: filling from the lockfile (registry-cache) and no wildcards in the allowlist."
design = ["10-planner-architect-coder.md#27-propose_dependency", "10-planner-architect-coder.md#48-propose_dependency"]
built_by = ["2-E01-T09"]

