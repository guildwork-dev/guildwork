# Area chain of stage 2. Rules: docs/plan/README.md. Check: python3 tools/plan/plan.py check
# Detailed design: docs/design/10-planner-architect-coder.md (rulings FE-1000 to FE-1099)
stage = "2"

[[epic]]
id = "2-E01"
title = "Shared building blocks of the agent services"
goal = "Blueprint sandbox, enforced egress proxy, registry cache offline, `propose_dependency`, no DNS, `foreign_input_seen`; plus the agent run shell and work-state snapshot that planner, architect and coder share"
sources = ["02 section 0", "05 section 3", "ADR-60, ADR-64"]
depends_on = ["1-E01"]

[[epic]]
id = "2-E02"
title = "Planner"
goal = "Read-only, plan verifier, plan critique, consistency analysis, versions, G1 by hand and automatic (automatic first in shadow for S7 c)"
sources = ["02 section 1", "10 section 4"]
depends_on = ["2-E01"]

[[epic]]
id = "2-E03"
title = "Architect"
goal = "Mode `review` (first in `shadow` on architecture PRs of the project repo), then `spec` (EARS), `adr`, threat model per STRIDE and `conformance` as a library in the reviewer"
sources = ["02 section 2", "ADR-46", "10 section 5"]
depends_on = ["2-E01"]

[[epic]]
id = "2-E04"
title = "Coder"
goal = "Self-check bundle, hard gates, draft PR per PR template, `agent-approval-check`, G4, question L1, steering L2, environment setup L4"
sources = ["02 section 3", "10 section 6"]
depends_on = ["2-E01", "1-E04"]

[[epic]]
id = "2-E05"
title = "Analyzers in mode run and quality-gate"
goal = "Analyzer contract `v1alpha1` binding, analyzers in their own tool sandbox with baseline, platform gate `quality-gate` for self-check and merge gate"
sources = ["01 section 12", "ADR-40"]
depends_on = ["1-E06"]

[[epic]]
id = "2-E06"
title = "CI on agent branches"
goal = "`security.agent_ci` with `agent_fork` or `guarded_workflows`, check in `doctor` and per claim, otherwise `no_safe_ci`; contract test `agent_fork` against GitHub"
sources = ["ADR-59", "05 section 3"]
depends_on = ["2-E04"]

[[epic]]
id = "2-E07"
title = "Pipeline ticket-to-pr"
goal = "From GitHub Issues, trigger via command and label `agent:auto`, stages with `on_disabled`, fix stage `on_disabled: human` until stage 4, S5 up to the draft PR"
sources = ["03 section 1", "02 section 11"]
depends_on = ["2-E02", "2-E04"]

[[epic]]
id = "2-E08"
title = "Eval, qualification and acceptance stage 2"
goal = "P1 to P4, AR1 to AR4, C1p, B1 to B4; Gate A green, Gate B required parts measured and reported; hard gates 0 violations; S1, S2, S5, S7 c; release with S8"
sources = ["07 sections 3.2 to 3.4", "10 sections 4 to 6"]
depends_on = ["2-E03", "2-E05", "2-E06", "2-E07"]

