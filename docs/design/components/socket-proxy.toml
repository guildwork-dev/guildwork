id = "socket-proxy"
title = "Socket proxy with allowlist and body check"
kind = "role"
path = "apps/worker/src/socket-proxy/"
package = "@guildwork/worker"
stage = "0"
area = "03"
purpose = "Sole holder of the Docker daemon socket on single-host: passes through to the worker only the Docker API calls that a sandbox needs, and checks on creation runtime, image digest, network, mounts, rights and label. Replaces no kernel boundary and knows no work items."
