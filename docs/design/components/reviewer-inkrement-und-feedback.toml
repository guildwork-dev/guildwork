purpose = "Line mapping since..head and ancestor check"

[[uses]]
interface = "reviewer-verifier/reviewer.verify"
from_task = "1-E04-T05"
purpose = "Recheck batch and verdicts still_present, fixed, unclear"

[[uses]]
interface = "reviewer-befunde/befund-repositories"
from_task = "1-E04-T05"
purpose = "read open findings, set states, write finding_feedback"

[[uses]]
interface = "reviewer-befunde/fingerprint-v1"
from_task = "1-E04-T05"
