id = "service-triage"
title = "Triage service: duplicates, classification, spam, verifier, auto_close"
kind = "service"
path = "services/triage/"
package = "@guildwork/service-triage"
stage = "7"
purpose = "Classifies new issues without a shell (duplicates and related items with visibility check, labels, assignees, repo, spam and slop, clarity), checks the result deterministically and publishes per property according to configuration; closing only with auto_close and a green T1 gate of the repo. In stage 7 only a single-service run; as the first stage of ticket-to-pr only from stage 9 (FE-1221). The GitHub methods (setLabels, linkItems, closeAsDuplicate) and the executors do not belong here."
design = [
  "12-expansion.md#26-triage-service-7-e04",
  "12-expansion.md#31-tables-of-stage-7",
  "12-expansion.md#34-envelopes-and-file-formats",
  "12-expansion.md#44-triage",
  "12-expansion.md#5-failure-and-abort-paths",
  "12-expansion.md#6-security",
  "12-expansion.md#7-configuration",
]
built_by = [
  "7-E04-T01",
  "7-E04-T02",
  "7-E04-T03",
  "7-E04-T04",
  "7-E04-T05",
  "7-E04-T06",
]

